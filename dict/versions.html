<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🏷️ 版本管理</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg,#1a1040 0%,#2d1b5e 50%,#1a1040 100%);
    min-height: 100vh;
    color: #fff;
    padding: 16px;
    padding-bottom: 40px;
}
.top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.back-btn {
    padding:8px 16px; border:none; border-radius:10px;
    background:rgba(255,255,255,0.1); color:#fff; font-size:14px; cursor:pointer;
}
.back-btn:active { transform:scale(0.95); }
.page-title { font-size:15px; color:#a8a8d8; letter-spacing:1px; }

.card {
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.12);
    border-radius:16px; padding:18px; margin-bottom:14px;
}
.card-title { font-size:16px; font-weight:bold; color:#ffd700; margin-bottom:12px; }

/* 当前版本 */
.cur-sha { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:24px; font-weight:bold; color:#4ecdc4; letter-spacing:1px; }
.cur-title { font-size:14px; color:#e8e8f5; margin-top:6px; }
.cur-sub { font-size:13px; color:#a8a8d8; margin-top:4px; line-height:1.7; }

.badge {
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:6px;
    vertical-align:middle; margin-left:8px; letter-spacing:0;
}
.badge.private { background:rgba(255,107,107,0.2); color:#ff8888; border:1px solid rgba(255,107,107,0.4); }
.badge.public  { background:rgba(57,217,138,0.18); color:#39d98a; border:1px solid rgba(57,217,138,0.4); }

.bar { height:8px; border-radius:4px; background:rgba(255,255,255,0.12); overflow:hidden; margin:10px 0 6px; }
.bar > div { height:100%; background:linear-gradient(90deg,#4ecdc4,#39d98a); transition:width .3s; }
.bar.warn > div { background:linear-gradient(90deg,#f39c12,#e8b33c); }
.bar.dead > div { background:#666; }

.expired-tip {
    font-size:13px; color:#ff8888; margin-top:8px;
    background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3);
    border-radius:8px; padding:8px 10px;
}

/* 列表 */
.vrow {
    display:flex; align-items:center; gap:10px;
    padding:12px; border-radius:12px; margin-bottom:8px;
    background:rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,255,255,0.1);
}
.vrow.active { border-color:rgba(78,205,196,0.65); background:rgba(78,205,196,0.1); }
.vrow.dead { opacity:0.5; }
.vrow .info { flex:1; min-width:0; }
.vrow .sha { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px; font-weight:bold; color:#fff; }
.vrow .sub { font-size:12px; color:#a8a8d8; margin-top:3px; line-height:1.6; }
.vrow .sub .warn { color:#f39c12; }
.vrow .sub .dead { color:#ff8888; }
.vrow .act { flex-shrink:0; }
.sw-btn {
    padding:8px 14px; border:none; border-radius:9px; font-size:13px; font-weight:bold;
    cursor:pointer; background:linear-gradient(90deg,#39d98a,#4ecdc4); color:#0d3b2e;
}
.sw-btn:active { transform:scale(0.97); }
.sw-btn:disabled {
    background:rgba(255,255,255,0.1); color:#7f7fa8; cursor:not-allowed;
}
.tag-cur {
    font-size:12px; padding:6px 10px; border-radius:8px;
    background:rgba(78,205,196,0.18); color:#4ecdc4; border:1px solid rgba(78,205,196,0.45);
}
.note { font-size:12px; color:#7f7fa8; line-height:1.8; }
</style>
</head>
<body>
<div class="top-bar">
    <button class="back-btn" onclick="location.href='../lab.html'">← 实验室</button>
    <div class="page-title">🏷️ 版本管理</div>
</div>

<div class="card">
    <div class="card-title">当前启用</div>
    <div id="curBox">加载中…</div>
</div>

<div class="card">
    <div class="card-title">登记版本</div>
    <div id="listBox"></div>
    <div class="note" id="listNote" style="margin-top:12px;"></div>
</div>

<script src="version.js?v=20261016"></script>
<script src="sidebar.js?v=20261016"></script>
<script>
function esc(s) {
    return String(s === null || s === undefined ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderCurrent() {
    var box = document.getElementById("curBox");
    var v = versionGetActive();
    if (!v) { box.innerText = "登记表为空"; return; }

    var left = versionDaysLeft(v);
    var total = (typeof v.days === "number") ? v.days : VERSION_DEFAULT_DAYS;
    var pct = (!total || left === Infinity) ? 100 : Math.max(0, Math.min(100, left / total * 100));
    var expired = left <= 0;

    var barClass = expired ? "bar dead" : (left <= 14 ? "bar warn" : "bar");
    var leftText = (left === Infinity) ? "永久有效"
        : (expired ? "已过期 " + Math.abs(left) + " 天" : "剩余 " + left + " 天");

    box.innerHTML =
        '<div class="cur-sha">' + esc(v.version) +
          '<span class="badge ' + versionChannelClass(v.channel) + '">' + esc(v.channel) + '</span>' +
        '</div>' +
        '<div class="cur-title">' + esc(v.title || "") + '</div>' +
        '<div class="cur-sub">登记于 ' + esc(v.date) + ' · ' + esc(versionExpiryText(v)) + '</div>' +
        '<div class="' + barClass + '"><div style="width:' + pct + '%"></div></div>' +
        '<div class="cur-sub">' + esc(leftText) + '</div>' +
        (v.note ? '<div class="cur-sub">' + esc(v.note) + '</div>' : '') +
        (expired ? '<div class="expired-tip">⚠️ 当前版本已超过 ' + total + ' 天有效期，建议切到仍有效的版本。</div>' : '');
}

function renderList() {
    var box = document.getElementById("listBox");
    var cur = versionGetActive();
    var curSha = cur ? cur.version : "";

    box.innerHTML = VERSION_REGISTRY.map(function (v) {
        var left = versionDaysLeft(v);
        var expired = left <= 0;
        var isCur = (v.version === curSha);

        var leftHtml = (left === Infinity) ? "永久有效"
            : (expired ? '<span class="dead">已过期 ' + Math.abs(left) + ' 天</span>'
                       : (left <= 14 ? '<span class="warn">剩余 ' + left + ' 天</span>' : '剩余 ' + left + ' 天'));

        var act;
        if (isCur) {
            act = '<span class="tag-cur">当前</span>';
        } else if (expired) {
            act = '<button class="sw-btn" type="button" disabled>已过期</button>';
        } else {
            act = '<button class="sw-btn" type="button" onclick="doSwitch(\'' + esc(v.version) + '\')">切换</button>';
        }

        return '<div class="vrow' + (isCur ? " active" : "") + (expired ? " dead" : "") + '">' +
            '<div class="info">' +
              '<div class="sha">' + esc(v.version) +
                '<span class="badge ' + versionChannelClass(v.channel) + '">' + esc(v.channel) + '</span>' +
              '</div>' +
              '<div class="sub">' + esc(v.title || "") + '<br>' +
                '登记 ' + esc(v.date) + ' · 有效期 ' + ((typeof v.days === "number") ? v.days : VERSION_DEFAULT_DAYS) + ' 天 · ' + leftHtml +
              '</div>' +
            '</div>' +
            '<div class="act">' + act + '</div>' +
        '</div>';
    }).join("");

    var hasBase = VERSION_REGISTRY.some(function (v) { return !!v.base; });
    document.getElementById("listNote").innerHTML =
        '共 ' + VERSION_REGISTRY.length + ' 个版本，其中 ' + versionValidCount() + ' 个仍在有效期内。' +
        (hasBase ? '' : '<br>这些版本都没有填部署地址（base），切换只记录「启用哪一版」；要让切换真正加载另一份构建，需把该版本单独部署后填进 base 字段。');
}

function doSwitch(sha) {
    var r = versionSetActive(sha);
    if (!r.ok) {
        alert("切换失败：" + r.reason);
        return;
    }
    if (r.redirect) return;   // 已跳转
    renderCurrent();
    renderList();
}

renderCurrent();
renderList();
versionOnChange(function () { renderCurrent(); renderList(); });
</script>
</body>
</html>
