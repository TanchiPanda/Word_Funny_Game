<!DOCTYPE html>

<script>
// 未开启实验功能时强制弹回来源页（无来源则回首页）
var LAB_OK = (typeof labGuard === "function") && labGuard("downloadDict", "../index.html", "下载词典") === true;
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html.lab-blocked body { display:none !important; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg,#1a1040 0%,#2d1b5e 50%,#1a1040 100%);
    min-height: 100vh;
    color: #fff;
    padding: 16px;
    padding-bottom: 40px;
}
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.back-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
}
.back-btn:active { transform: scale(0.95); }
.page-title { font-size: 15px; color: #a8a8d8; letter-spacing: 1px; }

.card {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
}
.card-title {
    font-size: 16px;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}
.badge {
    font-size: 11px;
    font-weight: normal;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(255,107,107,0.2);
    color: #ff8888;
    border: 1px solid rgba(255,107,107,0.4);
    letter-spacing: 0;
}
.badge.ok {
    background: rgba(57,217,138,0.18);
    color: #39d98a;
    border-color: rgba(57,217,138,0.4);
}

.book-info { font-size: 14px; color: #e8e8f5; line-height: 1.9; }
.book-info b { color: #4ecdc4; }
.book-info .dim { color: #a8a8d8; }

/* 范围选择 */
.scope-row { display: flex; flex-direction: column; gap: 10px; }
.scope-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    cursor: pointer;
    font-size: 15px;
}
.scope-item.on {
    border-color: rgba(78,205,196,0.6);
    background: rgba(78,205,196,0.1);
}
.scope-item input { width: 18px; height: 18px; accent-color: #4ecdc4; }
.scope-item .sub { font-size: 12px; color: #a8a8d8; margin-left: auto; }

/* 按钮 */
.btn {
    width: 100%;
    padding: 15px;
    border: none;

    font-size: 16px;

    box-shadow: 0 6px 18px rgba(57,217,138,0.3);
}
.btn-blank {
    background: linear-gradient(90deg,#6c5ce7,#a29bfe);
    color: #fff;
    box-shadow: 0 6px 18px rgba(108,92,231,0.35);
}
.note {
    font-size: 13px;
    color: #a8a8d8;
    line-height: 1.8;
    margin-top: 10px;
}
.note code {
    background: rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 4px;
    color: #ffd700;
}

<body>
<div class="top-bar">
    <button class="back-btn" onclick="goBack()">← 返回</button>
    <div class="page-title">📥 下载词典</div>
</div>

<div class="card">
    <div class="card-title">当前词书 <span class="badge ok">内部实验</span></div>
    <div class="book-info" id="bookInfo">加载中…</div>
</div>

<div class="card">
    <div class="card-title">导出范围</div>
    <div class="scope-row">
        <label class="scope-item on" id="scopeLevel">
            <input type="radio" name="scope" value="level" checked onchange="onScopeChange()">
            <span>当前课时</span>
            <span class="sub" id="scopeLevelSub"></span>
        </label>
        <label class="scope-item" id="scopeBook">
            <input type="radio" name="scope" value="book" onchange="onScopeChange()">
            <span>整本词书</span>
            <span class="sub" id="scopeBookSub"></span>
        </label>
    </div>
    <div class="note" id="previewNote"></div>
</div>

<div class="card">
    <div class="card-title">下载</div>
    <button class="btn btn-csv" type="button" onclick="doExport('full')">📄 导出 CSV（含英文）</button>
    <button class="btn btn-blank" type="button" onclick="doExport('blank')">✍️ 下载默写版（英语列留空）</button>
    <div class="note">
        列顺序：<code>序号 / 英文 / 音标 / 词性 / 中文</code>（整本导出时多一列 <code>课时</code>）。<br>
        默写版的「英文」列保留但内容为空，方便打印后手写填空。<br>
        文件为 UTF-8 带 BOM，Excel 直接双击不乱码。
    </div>
    <div class="status" id="status"></div>
</div>

<script src="wbook.js?v=20261016"></script>
<script src="sidebar.js?v=20261016"></script>
<script>
// 守卫未通过则不渲染（labGuard 已触发 location.replace）
if (!LAB_OK) {
    document.documentElement.classList.add("lab-blocked");
}

var book = null;
var bookIndex = 0;

// ---------- 返回 ----------
function goBack() {
    if (document.referrer) {
        try {
            var u = new URL(document.referrer);
            if (u.origin === location.origin) { location.href = document.referrer; return; }
        } catch (e) {}
    }
    location.href = "../index.html";
}

// ---------- 数据 ----------
function scopeValue() {
    var el = document.querySelector('input[name="scope"]:checked');
    return el ? el.value : "level";
}

function collectRows() {
    var scope = scopeValue();
    var out = [];
    if (scope === "level") {
        activeWordList().forEach(function (w, i) {
            out.push({ no: i + 1, level: "", w: w });
        });
    } else {
        var n = 0;
        book.levels.forEach(function (lv) {
            lv.words.forEach(function (w) {
                n++;
                out.push({ no: n, level: lv.name, w: w });
            });
        });
    }
    return out;
}

// ---------- CSV ----------
// RFC4180：含逗号/引号/换行的字段加引号，内部引号翻倍
function csvCell(v) {
    var s = (v === null || v === undefined) ? "" : String(v);
    if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
}
function csvLine(arr) { return arr.map(csvCell).join(","); }

function buildCsv(blankEn) {
    var withLevel = scopeValue() === "book";
    var head = ["序号"];
    if (withLevel) head.push("课时");
    head.push("英文", "音标", "词性", "中文");

    var lines = [csvLine(head)];
    collectRows().forEach(function (r) {
        var line = [r.no];
        if (withLevel) line.push(r.level);
        line.push(blankEn ? "" : (r.w.en || ""));   // 默写版：列保留、内容留空
        line.push(r.w.phonetic || "");
        line.push(r.w.pos || "");
        line.push(r.w.cn || "");
        lines.push(csvLine(line));
    });
    return lines.join("\r\n");
}

function safeName(s) {
    return String(s).replace(/[\\/:*?"<>|\s]+/g, "_");
}
function fileName(blankEn) {
    var lv = scopeValue() === "book" ? "全册" : book.levels[currentLevel].name;
    return safeName(book.name) + "_" + safeName(lv) + "_" + (blankEn ? "默写版" : "单词表") + ".csv";
}

function doExport(kind) {
    var blankEn = (kind === "blank");
    if (!book || !collectRows().length) {
        document.getElementById("status").innerText = "⚠️ 没有可导出的单词";
        return;
    }
    var csv = buildCsv(blankEn);
    var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName(blankEn);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);

    document.getElementById("status").innerText =
        "✅ 已导出 " + collectRows().length + " 条 → " + fileName(blankEn);
}

// ---------- 渲染 ----------
function onScopeChange() {
    document.getElementById("scopeLevel").classList.toggle("on", scopeValue() === "level");
    document.getElementById("scopeBook").classList.toggle("on", scopeValue() === "book");
    renderPreview();
}

function renderPreview() {
    var n = collectRows().length;
    document.getElementById("previewNote").innerText = "将导出 " + n + " 条单词。";
}

function init() {
    if (!LAB_OK) return;

    loadCurrentSelection();
    book = activeBook();
    if (!book) {
        document.getElementById("bookInfo").innerText = "没有可用的词书";
        return;
    }

    document.getElementById("bookInfo").innerHTML =
        "📖 <b>" + book.name + "</b>" + (book.free ? "（免费）" : "") + "<br>" +
        '<span class="dim">当前课时：' + book.levels[currentLevel].name +
        " · 共 " + activeWordList().length + " 词</span><br>" +
        '<span class="dim">整本：' + book.levels.length + " 个课时 · 共 " + bookTotalWords(book) + " 词</span>";

    document.getElementById("scopeLevelSub").innerText = activeWordList().length + " 词";
    document.getElementById("scopeBookSub").innerText = bookTotalWords(book) + " 词";
    renderPreview();
}
init();
</script>
</body>
</html>
