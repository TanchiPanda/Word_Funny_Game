<!DOCTYPE html>
<html lang="zh">
<head>
  <link rel="icon" type="image/svg+xml" href="../site-icon/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>词书编辑器 - 单词闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family: "Comic Sans MS","Chalkboard SE",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#162a22,#1a3a2e);color:#fff;min-height:100vh;padding:20px}
.wrap{max-width:900px;margin:0 auto}
h1{text-align:center;margin-bottom:16px;color:#ffd700}
.card{background:rgba(255,255,255,0.06);border-radius:16px;padding:16px;margin-bottom:14px}
select,input,textarea{width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(0,0,0,0.2);color:#fff;font-size:14px}
textarea{min-height:300px;resize:vertical;font-family:monospace;line-height:1.6}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:14px;margin:3px}
.btn-primary{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#162a22;font-weight:bold}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff}
.btn-red{background:#e74c3c;color:#fff}
.btn-green{background:#2ecc71;color:#fff}
.btn-muted{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.45);cursor:not-allowed;border:1px dashed rgba(255,255,255,0.2)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;background:rgba(255,255,255,0.08)}
.tab.active{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#162a22;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border:1px solid rgba(255,255,255,0.15);text-align:left}
th{background:rgba(255,255,255,0.1);font-weight:bold}
td input{border:none;background:transparent;padding:4px;font-size:14px}
td input:focus{outline:none;background:rgba(255,255,255,0.1)}
.book-list{display:flex;flex-direction:column;gap:6px}
.book-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;cursor:pointer}
.book-item:hover{background:rgba(255,255,255,0.1)}
.tip{font-size:12px;color:#b8d8c8;margin-top:8px;line-height:1.5}
.err{color:#e74c3c;font-size:13px;margin-top:6px}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row label{min-width:80px;font-size:13px;color:#b8d8c8}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>词书编辑器</h1>
<div class="card" id="listCard">
  <div style="font-size:16px;font-weight:bold;margin-bottom:10px;">我的词书</div>
  <div class="book-list" id="bookList"></div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="newBook()">+ 新建词书</button>
  </div>
  <div class="tip">词书直接保存在你的云端账号，无需手动导出。</div>
</div>
<div class="card hidden" id="editCard">
  <div class="row"><label>词书名称</label><input type="text" id="bookName" placeholder="例如：我的课外单词"></div>
  <div class="row"><label>课时名称</label><input type="text" id="levelName" placeholder="LV1"><button class="btn btn-ghost" onclick="addLevel()">+ 增加课时</button><button class="btn btn-red" onclick="delLevel()">删除课时</button></div>
  <div id="levelTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;"></div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('basic')">表格编辑</div>
    <div class="tab" onclick="switchTab('code')">代码编辑</div>
  </div>
  <div id="basicPanel">
    <table>
      <thead><tr><th style="width:25%">英文</th><th style="width:20%">音标</th><th style="width:12%">词性</th><th style="width:35%">中文</th><th style="width:8%"></th></tr></thead>
      <tbody id="wordRows"></tbody>
    </table>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-ghost" onclick="addRow()">+ 添加单词</button>
      <button class="btn btn-green" onclick="ocrPick()">📷 识图导入词书</button>
      <input type="file" id="ocrFile" accept="image/*" style="display:none" onchange="ocrHandle(this)">
      <span id="ocrHint" style="font-size:12px;color:#b8d8c8"></span>
    </div>
  </div>
  <div id="codePanel" class="hidden">
    <textarea id="codeInput" placeholder='[{"name":"LV1","words":[{"en":"apple","phonetic":"/ˈæpl/","pos":"n.","cn":"苹果"}]}]'></textarea>
    <div class="err" id="codeErr"></div>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="saveBook()">保存</button>
    <button class="btn btn-red" onclick="deleteBook()">删除</button>
    <button class="btn btn-ghost" onclick="backToList()">← 返回</button>
  </div>
</div>
<div style="text-align:center;margin-top:16px"><button class="btn btn-ghost" onclick="location.href='chooser.html'">← 选课时</button></div>
</div>
<script src="sbauth.js?v=20261031"></script>
<script src="sb-data.js?v=20261031"></script>
<script>
let _books = [];
let editingId = null;
let currentLevelIdx = 0;
let editMode = "basic";
async function refreshList() {
  try { _books = await SBData.listBooks(); }
  catch (e) { _books = []; alert("读取词书失败：" + ((e && e.message) || e)); }
  renderList();
}
function renderList() {
  const el = document.getElementById("bookList");
  if (!_books.length) { el.innerHTML = '<div style="color:#b8d8c8;padding:16px;text-align:center">还没有词书，点上方新建</div>'; return; }
  el.innerHTML = _books.map((b) => {
    let wc = 0; try { b.data.forEach(l => wc += l.words.length); } catch {}
    return '<div class="book-item" onclick="editBook(\''+b.id+'\')"><div><div style="font-weight:bold">'+b.name+'</div><div style="font-size:12px;color:#b8d8c8">'+b.data.length+' 课时 · '+wc+' 词</div></div><div style="display:flex;gap:4px"><button class="btn btn-red" onclick="event.stopPropagation();delBookById(\''+b.id+'\')">删</button></div></div>';
  }).join("");
}
function newBook() {
  editingId = null; currentLevelIdx = 0;
  document.getElementById("bookName").value = "";
  document.getElementById("levelName").value = "LV1";
  document.getElementById("codeInput").value = JSON.stringify([{name:"LV1",words:[{en:"example",phonetic:"/ɪɡˈzɑːmpl/",pos:"n.",cn:"例子"}]}], null, 2);
  loadCodeToBasic(); showEdit();
}
function editBook(id) {
  const b = _books.find(x => x.id === id); if (!b) return;
  editingId = id; currentLevelIdx = 0;
  document.getElementById("bookName").value = b.name;
  document.getElementById("levelName").value = (b.data[0] && b.data[0].name) || "LV1";
  document.getElementById("codeInput").value = JSON.stringify(b.data, null, 2);
  loadCodeToBasic(); showEdit();
}
function showEdit(){document.getElementById("listCard").classList.add("hidden");document.getElementById("editCard").classList.remove("hidden");}
function backToList(){document.getElementById("editCard").classList.add("hidden");document.getElementById("listCard").classList.remove("hidden");refreshList();}
function switchTab(m){
  editMode = m;
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active", (i===0&&m==="basic")||(i===1&&m==="code")));
  if(m==="basic"){ saveBasicToCode(); loadCodeToBasic(); }
  else { saveBasicToCode(); document.getElementById("codeErr").innerText=""; }
  document.getElementById("basicPanel").classList.toggle("hidden", m!=="basic");
  document.getElementById("codePanel").classList.toggle("hidden", m!=="code");
}
function addRow(word){
  const tbody = document.getElementById("wordRows");
  const tr = document.createElement("tr");
  tr.innerHTML = '<td><input value="'+(word&&word.en||'')+'" data-f="en"></td><td><input value="'+(word&&word.phonetic||'')+'" data-f="phonetic"></td><td><input value="'+(word&&word.pos||'')+'" data-f="pos"></td><td><input value="'+(word&&word.cn||'')+'" data-f="cn"></td><td><button class="btn btn-red" style="padding:4px 8px" onclick="this.closest(\'tr\').remove()">删</button></td>';
  tbody.appendChild(tr);
}
function loadCodeToBasic(){
  try{
    const data = JSON.parse(document.getElementById("codeInput").value);
    if(!Array.isArray(data)||!data.length) return;
    if(currentLevelIdx >= data.length) currentLevelIdx = data.length - 1;
    document.getElementById("levelName").value = (data[currentLevelIdx] && data[currentLevelIdx].name) || "LV1";
    const words = (data[currentLevelIdx] && data[currentLevelIdx].words) || [];
    const tbody = document.getElementById("wordRows");
    tbody.innerHTML = "";
    words.forEach(w=>addRow(w));
    if(!words.length) addRow();
    renderLevelTabs();
  }catch(e){}
}
function renderLevelTabs(){
  try{
    const data = JSON.parse(document.getElementById("codeInput").value);
    const el = document.getElementById("levelTabs");
    el.innerHTML = data.map((l,i)=>'<button class="btn '+(i===currentLevelIdx?'btn-primary':'btn-ghost')+'" onclick="switchLevel('+i+')">'+(l.name||('课时'+(i+1)))+'</button>').join("");
  }catch(e){}
}
function switchLevel(i){saveBasicToCode();currentLevelIdx=i;loadCodeToBasic();}
function addLevel(){
  saveBasicToCode();
  try{
    const data = JSON.parse(document.getElementById("codeInput").value);
    if(!Array.isArray(data)) data = [];
    data.push({name:"LV"+(data.length+1), words:[]});
    currentLevelIdx = data.length - 1;
    document.getElementById("codeInput").value = JSON.stringify(data, null, 2);
    loadCodeToBasic();
  }catch(e){}
}
function delLevel(){
  try{
    const data = JSON.parse(document.getElementById("codeInput").value);
    if(!Array.isArray(data)||data.length<=1){ alert("至少保留一个课时"); return; }
    if(!confirm("删除课时「"+((data[currentLevelIdx]&&data[currentLevelIdx].name)||"")+"」？")) return;
    data.splice(currentLevelIdx,1);
    if(currentLevelIdx >= data.length) currentLevelIdx = data.length - 1;
    document.getElementById("codeInput").value = JSON.stringify(data, null, 2);
    loadCodeToBasic();
  }catch(e){}
}
function saveBasicToCode(){
  const rows = document.querySelectorAll("#wordRows tr");
  const words = [];
  rows.forEach(tr=>{
    const w = {};
    tr.querySelectorAll("input").forEach(inp=>{ w[inp.dataset.f] = inp.value.trim(); });
    if(w.en) words.push(w);
  });
  let data;
  try{ data = JSON.parse(document.getElementById("codeInput").value); }catch{ data = []; }
  if(!Array.isArray(data)||!data.length) data = [{name:"LV1",words:[]}];
  data[currentLevelIdx] = { name: document.getElementById("levelName").value || "LV1", words };
  document.getElementById("codeInput").value = JSON.stringify(data, null, 2);
}
async function saveBook(){
  saveBasicToCode();
  const name = document.getElementById("bookName").value.trim();
  if(!name){ alert("请输入词书名称"); return; }
  let data;
  try{
    data = JSON.parse(document.getElementById("codeInput").value);
    if(!Array.isArray(data)) throw "必须是数组";
    data.forEach((l,i)=>{ if(!l.name) throw "第"+(i+1)+"课时缺少 name"; if(!Array.isArray(l.words)) throw "第"+(i+1)+"课时 words 不是数组"; });
  }catch(e){ alert("格式错误："+e); return; }
  try { await SBData.saveBookFull(editingId, name, data); alert("✅ 已保存"); backToList(); }
  catch (e) { alert("保存失败：" + ((e && e.message) || e)); }
}
async function deleteBook(){
  if(!editingId) return;
  if(!confirm("删除这个词书？")) return;
  try { await SBData.deleteBook(editingId); backToList(); }
  catch (e) { alert("删除失败：" + ((e && e.message) || e)); }
}
async function delBookById(id){
  if(!confirm("删除这个词书？")) return;
  try { await SBData.deleteBook(id); refreshList(); }
  catch (e) { alert("删除失败：" + ((e && e.message) || e)); }
}
refreshList();

// ===== 识图导入词书（Workers AI） =====
function ocrPick(){
  if(typeof sbGetUser === "function" && !sbGetUser()){
    alert("请先登录后再使用识图导入");
    return;
  }
  var f = document.getElementById("ocrFile");
  f.value = "";
  f.click();
}

// 压缩图片：长边 ≤1600px，JPEG 0.85
function ocrCompress(file){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      try{
        var max = 1600;
        var w = img.width, h = img.height;
        if(Math.max(w,h) > max){
          var s = max / Math.max(w,h);
          w = Math.round(w*s); h = Math.round(h*s);
        }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL("image/jpeg", 0.85));
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("图片读取失败")); };
    img.src = url;
  });
}

async function ocrHandle(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var hint = document.getElementById("ocrHint");
  try{
    hint.textContent = "正在压缩图片…";
    var image = await ocrCompress(file);
    if(image.length > 5_600_000) throw new Error("图片太大，请换一张小一点的");

    var token = (typeof sbGetAccessToken === "function") ? await sbGetAccessToken() : null;
    if(!token) throw new Error("登录已过期，请重新登录");

    hint.textContent = "正在识别，约需 5–15 秒…";
    var resp = await fetch("/api/vision", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ image: image })
    });
    var d = await resp.json();
    if(!resp.ok || !d.ok) throw new Error(d.error || ("请求失败 " + resp.status));

    var words = d.words || [];
    if(!words.length){
      hint.textContent = "没识别到单词，可换个角度或更清晰的图";
      if(d.raw) console.warn("vision raw:", d.raw);
      return;
    }

    var tbody = document.getElementById("wordRows");
    // 表格里若只有一个空行，先清掉
    var onlyEmpty = tbody.rows.length === 1 && ["en","phonetic","pos","cn"].every(function(f){
      return !(tbody.rows[0].querySelector('[data-f="'+f+'"]') || {}).value;
    });
    if(onlyEmpty) tbody.innerHTML = "";

    // 已存在的词先去重，避免重复导入
    var have = {};
    Array.prototype.forEach.call(tbody.querySelectorAll('[data-f="en"]'), function(el){
      if(el.value.trim()) have[el.value.trim().toLowerCase()] = 1;
    });
    var added = 0, dup = 0;
    words.forEach(function(w){
      if(have[w.en.toLowerCase()]){ dup++; return; }
      have[w.en.toLowerCase()] = 1;
      addRow(w); added++;
    });
    saveBasicToCode();

    hint.textContent = "已导入 " + added + " 个词" + (dup ? "，跳过重复 " + dup + " 个" : "") +
      (d.quota ? "（今日 " + d.quota.used + "/" + d.quota.limit + "）" : "");
  }catch(e){
    hint.textContent = "失败：" + ((e && e.message) || e);
  }
}
</script>
<script src="sidebar.js?v=20261017b"></script>
<script src="desktop-download.js?v=20261017b"></script>
</body>
</html>
