<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高级同步设置 - 单词闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;padding:16px}
.wrap{max-width:680px;margin:0 auto}
h1{text-align:center;margin-bottom:16px;color:#ffd700;font-size:22px}
.card{background:rgba(255,255,255,0.06);border-radius:14px;padding:14px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:bold;margin-bottom:10px;color:#ffd700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.btn{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-size:14px;flex:1;min-width:90px}
.btn-primary{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a2e;font-weight:bold}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff}
.btn-red{background:#e74c3c;color:#fff}
.btn-green{background:#2ecc71;color:#fff}
.info{font-size:13px;line-height:1.8;color:#ccc;word-break:break-all}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;margin-left:6px}
.badge-off{background:#555;color:#aaa}
.badge-ok{background:#2ecc71;color:#fff}
.badge-err{background:#e74c3c;color:#fff}
.badge-sync{background:#f39c12;color:#fff}
pre{background:rgba(0,0,0,0.3);padding:10px;border-radius:8px;font-size:12px;overflow-x:auto;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.back{display:block;text-align:center;margin-top:8px;color:#a8a8d8;text-decoration:none;font-size:14px}
.switch{position:relative;display:inline-block;width:54px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:rgba(255,255,255,0.18);border-radius:30px;cursor:pointer;transition:0.3s}
.slider::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:0.3s}
.switch input:checked+.slider{background:linear-gradient(90deg,#39d98a,#4ecdc4)}
.switch input:checked+.slider::before{transform:translateX(24px)}
.sync-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.sync-status-row{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:bold}
.sync-status-row .dot{width:12px;height:12px;border-radius:50%;background:#888}
.sync-status-row.off{color:#aaa}
.sync-status-row.idle{color:#39d98a}
.sync-status-row.idle .dot{background:#39d98a;box-shadow:0 0 8px #39d98a}
.sync-status-row.syncing{color:#ffd700}
.sync-status-row.syncing .dot{background:#ffd700;box-shadow:0 0 8px #ffd700;animation:pulse 1s infinite}
.sync-status-row.error{color:#ff8888}
.sync-status-row.error .dot{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div class="wrap">
<h1>⚙️ 高级同步设置</h1>

<div class="card">
  <div class="card-title">📊 同步状态</div>
  <div class="sync-status-row" id="syncRow">
    <span class="dot" id="syncDot"></span>
    <span id="syncText">同步未开启</span>
  </div>
  <div class="info" style="margin-top:8px">
    <div>存储：Backblaze B2（R6T5 共享）</div>
    <div>上次成功：<span id="lastOk">-</span></div>
  </div>
</div>

<div class="card">
  <div class="card-title">🔧 开关</div>
  <div class="sync-row">
    <span style="font-size:15px">启用云同步</span>
    <label class="switch"><input type="checkbox" id="b2Enabled" onchange="onToggle(this.checked)"><span class="slider"></span></label>
  </div>
  <div id="toggleHint" style="font-size:12px;color:#a8a8d8;margin-top:4px"></div>
  <div class="row" style="margin-top:12px">
    <button class="btn btn-green" onclick="doPull()">📥 拉取</button>
    <button class="btn btn-primary" onclick="doPush()">📤 推送</button>
  </div>
</div>

<div class="card">
  <div class="card-title">🔍 诊断</div>
  <div class="row">
    <button class="btn btn-ghost" onclick="runDiag()">运行诊断</button>
    <button class="btn btn-red" onclick="reauth()">重新登录</button>
  </div>
</div>

<div class="card">
  <div class="card-title">📝 同步记录</div>
  <pre id="log">（暂无记录）</pre>
</div>

<a class="back" href="../settings.html">← 返回设置</a>
</div>

<script src="sync.js?v=20261001f"></script>
<script src="auth.js?v=20261001f"></script>
<script>
var logs = [];
function log(msg){
  var t = new Date().toLocaleTimeString();
  logs.push("["+t+"] "+msg);
  if(logs.length>50) logs.shift();
  document.getElementById("log").innerText = logs.join("\n");
}

function onToggle(on){
  localStorage.setItem("wordGameB2Enabled", on?"1":"0");
  // 强制使用 R6T5 预设参数
  localStorage.setItem("wordGameB2Preset","1");
  localStorage.setItem("wordGameB2Endpoint","s3.us-east-005.backblazeb2.com");
  localStorage.setItem("wordGameB2Bucket","R6T5Data");
  localStorage.setItem("wordGameB2KeyId","005c54e99fa03480000000002");
  localStorage.setItem("wordGameB2AppKey","K005rSwwGtkJfJ2fOaJ9qAoKoUY2/bw");
  document.getElementById("toggleHint").innerText = on ? "✅ 已启用，下次进入游戏自动同步" : "已关闭，数据仅保存在本地";
  log("同步开关："+(on?"开启":"关闭"));
  if(on){ doPull(); }
}

function doPull(){ log("手动拉取…"); syncPull(function(m){ log(m); }); }
function doPush(){ log("手动推送…"); syncPush(function(m){ log(m); }); }

function runDiag(){
  log("运行诊断…");
  syncDiagnose().then(function(r){ log(r); alert(r); });
}

function reauth(){
  if(!confirm("清除登录状态并跳转重新登录？")) return;
  ["wordGameGitHubUser","wordGameMSAToken","wordGameMSARefresh","wordGameMSAExpires"].forEach(function(k){ localStorage.removeItem(k); });
  location.href = "../login.html?gettoken=true";
}

function refreshView(){
  var s = getSyncState();
  var row = document.getElementById("syncRow");
  row.className = "sync-status-row "+s.state;
  var labels = { off:"同步未开启", idle:"已同步"+(s.lastOk?" · "+s.lastOk:""), syncing:"正在同步…", error:"同步错误" };
  document.getElementById("syncText").innerText = labels[s.state]||s.state;
  document.getElementById("lastOk").innerText = s.lastOk||"-";
}

onSyncStateChange(function(state,err,lastOk){
  log("状态："+state+(err?" ("+err+")":""));
  refreshView();
});

// 加载
document.getElementById("b2Enabled").checked = localStorage.getItem("wordGameB2Enabled")==="1";
document.getElementById("toggleHint").innerText = document.getElementById("b2Enabled").checked ? "✅ 已启用" : "已关闭";
refreshView();
</script>
<script src="sidebar.js?v=20261001f"></script>
</body>
</html>
