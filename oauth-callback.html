<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录中…</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei","PingFang SC",sans-serif; }
    body {
        min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(135deg,#2c1b54,#422880); color:#fff; text-align:center; padding:20px;
    }
    .box { max-width:400px; }
    .spinner {
        width:48px; height:48px; border:4px solid rgba(255,255,255,0.2);
        border-top-color:#ffd700; border-radius:50%;
        margin:0 auto 20px; animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .title { font-size:20px; margin-bottom:10px; }
    .msg { font-size:14px; color:#a8a8d8; line-height:1.6; }
    .error { color:#ff8888; }
    .btn {
        display:inline-block; margin-top:18px; padding:10px 24px;
        border:none; border-radius:10px; background:#ffd700; color:#222;
        font-size:15px; font-weight:bold; cursor:pointer; text-decoration:none;
    }
</style>
</head>
<body>
<div class="box">
    <div class="spinner" id="spinner"></div>
    <div class="title" id="title">正在完成登录…</div>
    <div class="msg" id="msg"></div>
</div>
<script src="dict/auth.js?v=20260925b"></script>
<script>
(async function() {
    const result = await handleOAuthCallback();
    const spinner = document.getElementById("spinner");
    const title = document.getElementById("title");
    const msg = document.getElementById("msg");
    if (result.ok) {
        spinner.style.display = "none";
        title.innerText = "✅ 登录成功";
        msg.innerHTML = "欢迎，<b style='color:#ffd700'>" + (result.user.login || "") + "</b>！正在进入…";
        setTimeout(() => { location.href = "index.html"; }, 800);
    } else {
        spinner.style.display = "none";
        title.innerText = "❌ 登录失败";
        msg.className = "msg error";
        msg.innerText = result.message;
        msg.innerHTML += '<br><br><a class="btn" href="index.html">返回首页</a>';
    }
})();
</script>
<script src="dict/sidebar.js?v=20260926"></script>
</body>
</html>
