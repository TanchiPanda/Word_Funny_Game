<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🧪 实验室</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg,#1a1040 0%,#2d1b5e 50%,#1a1040 100%);
    min-height: 100vh;
    color: #fff;
    padding: 16px;
    padding-bottom: 40px;
}
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.back-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
}
.back-btn:active { transform: scale(0.95); }
.page-title {
    font-size: 15px;
    color: #a8a8d8;
    letter-spacing: 1px;
}

/* 顶部介绍卡 */
.intro-card {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(78,205,196,0.25);
    border-radius: 18px;
    padding: 20px 18px;
    margin-bottom: 16px;
}
.intro-title {
    font-size: 20px;
    font-weight: bold;
    color: #4ecdc4;
    margin-bottom: 8px;
}
.intro-desc {
    font-size: 14px;
    color: #a8a8d8;
    line-height: 1.7;
}

/* 模块挂载区 */
#labRoot {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* 空状态 */
.empty-state {
    border: 1.5px dashed rgba(255,255,255,0.18);
    border-radius: 16px;
    padding: 44px 20px;
    text-align: center;
}
.empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.7;
}
.empty-title {
    font-size: 15px;
    color: #e8e8f5;
    margin-bottom: 6px;
}
.empty-hint {
    font-size: 13px;
    color: #7f7fa8;
    line-height: 1.7;
}

/* 通用实验室卡片（供后续模块复用） */
.lab-card {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 18px;
}
.lab-card-title {
    font-size: 16px;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 10px;
}
/* 模块内通用元件 */
.lab-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
}
.lab-badge.public {
    background: rgba(57,217,138,0.18);
    color: #39d98a;
    border-color: rgba(57,217,138,0.4);
}
.lab-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(255,107,107,0.2);
    color: #ff8888;
    border: 1px solid rgba(255,107,107,0.4);
}
.lab-state {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 6px;
}
.lab-state.on {
    background: rgba(57,217,138,0.18);
    color: #39d98a;
    border: 1px solid rgba(57,217,138,0.4);
}
.lab-state.off {
    background: rgba(255,255,255,0.08);
    color: #a8a8d8;
    border: 1px solid rgba(255,255,255,0.15);
}
.lab-desc {
    font-size: 13px;
    color: #a8a8d8;
    line-height: 1.8;
    margin-bottom: 14px;
}
.lab-actions { display: flex; flex-direction: column; gap: 8px; }
/* 功能自身的版本信息 */
.lab-ver {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 12px;
    color: #a8a8d8;
    margin-bottom: 12px;
    padding: 8px 10px;
    border-radius: 9px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
}
.lab-ver b {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color: #4ecdc4;
}
.badge-mini {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 5px;
}
.badge-mini.private { background: rgba(255,107,107,0.2); color: #ff8888; }
.badge-mini.public  { background: rgba(57,217,138,0.18); color: #39d98a; }
.lab-ver .ver-left { color: #7f7fa8; }
.lab-ver .ver-left.dead { color: #ff8888; }
.lab-ver .ver-link {
    margin-left: auto;
    padding: 3px 9px;
    border: 1px solid rgba(78,205,196,0.4);
    border-radius: 7px;
    background: rgba(78,205,196,0.1);
    color: #4ecdc4;
    font-size: 11px;
    cursor: pointer;
}
.lab-ver .ver-tag { color: #a8a8d8; }
.lab-ver .ver-link:active { transform: scale(0.96); }.lab-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 11px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    color: #fff;
    transition: transform 0.15s;
}
.lab-btn:active { transform: scale(0.98); }
.lab-btn.primary {
    background: linear-gradient(90deg,#39d98a,#4ecdc4);
    color: #0d3b2e;
    box-shadow: 0 5px 16px rgba(57,217,138,0.3);
}
</style>
</head>
<body>
<div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">← 返回</button>
    <div class="page-title">🧪 实验室</div>
</div>

<div class="intro-card">
    <div class="intro-title">🧪 实验室</div>
    <div class="intro-desc">
        试验性功能都放在这里。目前是空的，等着往里装东西。
    </div>
</div>

<!-- 模块挂载点：后续功能直接往这里 append -->
<div id="labRoot"></div>

<script src="dict/wbook.js?v=20261016"></script>
<script src="dict/sync.js?v=20261016"></script>
<script src="dict/msauth.js?v=20261016"></script>
<script src="dict/auth.js?v=20261016"></script>
<script src="dict/lab.js?v=20261016"></script>
<script src="dict/version.js?v=20261016"></script>
<script>
// ===== 实验室：模块注册表 =====
// 后续每个试验功能写成 { id, title, render(el) }，
// 用 Lab.register(...) 注册即可自动渲染，不用改本页结构。
window.Lab = (function () {
    const modules = [];

    function register(mod) {
        if (!mod || !mod.id || typeof mod.render !== "function") {
            console.warn("[Lab] 模块格式不对，已忽略：", mod);
            return;
        }
        if (modules.some(m => m.id === mod.id)) {
            console.warn("[Lab] 模块 id 重复，已忽略：" + mod.id);
            return;
        }
        modules.push(mod);
    }

    function renderAll() {
        const root = document.getElementById("labRoot");
        root.innerHTML = "";

        if (!modules.length) {
            root.innerHTML =
                '<div class="empty-state">' +
                '  <div class="empty-icon">🧪</div>' +
                '  <div class="empty-title">还没有实验项目</div>' +
                '  <div class="empty-hint">这里将陆续放入试验性功能<br>当前为空白页面</div>' +
                '</div>';
            return;
        }

        modules.forEach(mod => {
            const card = document.createElement("div");
            card.className = "lab-card";
            card.id = "lab-" + mod.id;
            if (mod.title) {
                const t = document.createElement("div");
                t.className = "lab-card-title";
                t.innerText = mod.title;
                card.appendChild(t);
            }
            const body = document.createElement("div");
            card.appendChild(body);
            root.appendChild(card);
            try {
                mod.render(body);
            } catch (e) {
                body.innerHTML = '<div style="color:#ff8888;font-size:13px;">模块加载失败：' + (e.message || e) + '</div>';
            }
        });
    }

    return { register, renderAll, modules };
})();

// ===== 启动 =====
// ---------- 模块：下载词典 ----------
(function () {
    var FEATURE = "downloadDict";
    var NAME = "下载词典";

    function render(el) {
        el.innerHTML =
            '<div class="lab-meta">' +
            '  <span class="lab-badge">内部实验</span>' +
            '  <span class="lab-state" id="labState-dl"></span>' +
            '</div>' +
            '<div class="lab-desc">把当前词书导出成 CSV，或者生成英语列留空的默写版打印手写。</div>' +
            '<div class="lab-ver" id="labVerLine-dl"></div>' +
            '<div class="lab-actions" id="labActions-dl"></div>';

        paint(el);
        labOnChange(function () {
            if (document.body.contains(el)) paint(el);
        });
        versionOnChange(function () {
            if (document.body.contains(el)) paint(el);
        });
    }

    // 该功能自己的版本信息（与其他实验功能互不相干）
    function paintVersion(el) {
        var box = el.querySelector("#labVerLine-dl");
        var v = featVersionGetActive(FEATURE);
        if (!v) { box.innerHTML = ""; return; }
        var left = featVersionDaysLeft(v);
        var leftText = (left === Infinity) ? "永久有效"
            : (left <= 0 ? "已过期" : "剩余 " + left + " 天");
        box.innerHTML =
            '<span class="ver-tag">该功能版本 <b>' + v.version + '</b></span>' +
            '<span class="badge-mini ' + versionChannelClass(v.channel) + '">' + v.channel + '</span>' +
            '<span class="ver-left' + (left <= 0 ? " dead" : "") + '">' + leftText + '</span>' +
            '<button class="ver-link" type="button" id="labVerGo-dl">版本记录</button>';
        box.querySelector("#labVerGo-dl").onclick = function () {
            location.href = "dict/versions.html?f=" + encodeURIComponent(FEATURE);
        };
    }

    function paint(el) {
        var on = labEnabled(FEATURE);
        var st = el.querySelector("#labState-dl");
        var ac = el.querySelector("#labActions-dl");

        paintVersion(el);

        st.className = "lab-state " + (on ? "on" : "off");
        st.innerText = on ? "已开启" : "未开启";

        if (on) {
            ac.innerHTML =
                '<button class="lab-btn primary" type="button" id="labGo-dl">📥 进入下载页</button>' +
                '<button class="lab-btn" type="button" id="labOff-dl">关闭该功能</button>';
            ac.querySelector("#labGo-dl").onclick = function () {
                location.href = "dict/download.html";
            };
            ac.querySelector("#labOff-dl").onclick = function () {
                if (!confirm("确定关闭「" + NAME + "」？关闭后首页的「线下记背」会重新上锁。")) return;
                labSetEnabled(FEATURE, false);
            };
        } else {
            ac.innerHTML = '<button class="lab-btn primary" type="button" id="labOn-dl">🔒 输入口令开启</button>';
            ac.querySelector("#labOn-dl").onclick = function () {
                if (labAskPass(FEATURE, NAME)) location.href = "dict/download.html";
            };
        }
    }

    Lab.register({ id: FEATURE, title: "📥 " + NAME, render: render });
})();

// ---------- 模块：多选课时（公测）----------
(function () {
    var FEATURE = "multiLevel";
    var NAME = "多选课时";

    function render(el) {
        el.innerHTML =
            '<div class="lab-meta">' +
            '  <span class="lab-badge public">公测</span>' +
            '  <span class="lab-state" id="labState-ml"></span>' +
            '</div>' +
            '<div class="lab-desc">在选课时页可同时勾选多个课时（再点一次取消），学习、配对、拼写都用合并后的词表。</div>' +
            '<div class="lab-ver" id="labVerLine-ml"></div>' +
            '<div class="lab-actions" id="labActions-ml"></div>';

        paint(el);
        labOnChange(function () { if (document.body.contains(el)) paint(el); });
        versionOnChange(function () { if (document.body.contains(el)) paint(el); });
    }

    function paintVersion(el) {
        var box = el.querySelector("#labVerLine-ml");
        var v = featVersionGetActive(FEATURE);
        if (!v) { box.innerHTML = '<span class="ver-tag">尚未登记版本</span>'; return; }
        var left = featVersionDaysLeft(v);
        var leftText = (left === Infinity) ? "永久有效"
            : (left <= 0 ? "已过期" : "剩余 " + left + " 天");
        box.innerHTML =
            '<span class="ver-tag">该功能版本 <b>' + v.version + '</b></span>' +
            '<span class="badge-mini ' + versionChannelClass(v.channel) + '">' + v.channel + '</span>' +
            '<span class="ver-left' + (left <= 0 ? " dead" : "") + '">' + leftText + '</span>' +
            '<button class="ver-link" type="button" id="labVerGo-ml">版本记录</button>';
        box.querySelector("#labVerGo-ml").onclick = function () {
            location.href = "dict/versions.html?f=" + encodeURIComponent(FEATURE);
        };
    }

    function paint(el) {
        var on = labEnabled(FEATURE);
        var st = el.querySelector("#labState-ml");
        var ac = el.querySelector("#labActions-ml");

        paintVersion(el);

        st.className = "lab-state " + (on ? "on" : "off");
        st.innerText = on ? "已开启（默认）" : "已关闭";

        if (on) {
            ac.innerHTML =
                '<button class="lab-btn primary" type="button" id="labGo-ml">📚 去选课时页多选</button>' +
                '<button class="lab-btn" type="button" id="labOff-ml">关闭该功能</button>';
            ac.querySelector("#labGo-ml").onclick = function () {
                location.href = "dict/chooser.html";
            };
            ac.querySelector("#labOff-ml").onclick = function () {
                if (!confirm("关闭「" + NAME + "」后，选课时页会退回单选，已多选的课时会收敛成一个。")) return;
                labSetEnabled(FEATURE, false);
            };
        } else {
            ac.innerHTML = '<button class="lab-btn primary" type="button" id="labOn-ml">重新开启</button>';
            ac.querySelector("#labOn-ml").onclick = function () {
                labSetEnabled(FEATURE, true);
            };
        }
    }

    Lab.register({ id: FEATURE, title: "📚 " + NAME, render: render });
})();

// ---------- 模块：连连看游戏参数（内测）----------
(function () {
    var FEATURE = "gameParams";
    var NAME = "连连看游戏参数";

    function render(el) {
        el.innerHTML =
            '<div class="lab-meta">' +
            '  <span class="lab-badge">Private 实验</span>' +
            '  <span class="lab-state" id="labState-gp"></span>' +
            '</div>' +
            '<div class="lab-desc">在设置页挑选连连看的玩法预设：难度预设（当前 4 个）与形式预设（天堂／挑战赛／计时赛／综合赛）两组互斥，选中一个即整体替换。</div>' +
            '<div class="lab-ver" id="labVerLine-gp"></div>' +
            '<div class="lab-actions" id="labActions-gp"></div>';

        paint(el);
        labOnChange(function () { if (document.body.contains(el)) paint(el); });
        versionOnChange(function () { if (document.body.contains(el)) paint(el); });
    }

    function paintVersion(el) {
        var box = el.querySelector("#labVerLine-gp");
        var v = featVersionGetActive(FEATURE);
        if (!v) { box.innerHTML = '<span class="ver-tag">尚未登记版本</span>'; return; }
        var left = featVersionDaysLeft(v);
        var leftText = (left === Infinity) ? "永久有效"
            : (left <= 0 ? "已过期" : "剩余 " + left + " 天");
        box.innerHTML =
            '<span class="ver-tag">该功能版本 <b>' + v.version + '</b></span>' +
            '<span class="badge-mini ' + versionChannelClass(v.channel) + '">' + v.channel + '</span>' +
            '<span class="ver-left' + (left <= 0 ? " dead" : "") + '">' + leftText + '</span>' +
            '<button class="ver-link" type="button" id="labVerGo-gp">版本记录</button>';
        box.querySelector("#labVerGo-gp").onclick = function () {
            location.href = "dict/versions.html?f=" + encodeURIComponent(FEATURE);
        };
    }

    function paint(el) {
        var on = labEnabled(FEATURE);
        var st = el.querySelector("#labState-gp");
        var ac = el.querySelector("#labActions-gp");

        paintVersion(el);

        st.className = "lab-state " + (on ? "on" : "off");
        st.innerText = on ? "已开启" : "未开启";

        if (on) {
            ac.innerHTML =
                '<button class="lab-btn primary" type="button" id="labGo-gp">🎮 去设置页调整</button>' +
                '<button class="lab-btn" type="button" id="labOff-gp">关闭该功能</button>';
            ac.querySelector("#labGo-gp").onclick = function () {
                location.href = "settings.html";
            };
            ac.querySelector("#labOff-gp").onclick = function () {
                if (!confirm("确定关闭「" + NAME + "」？关闭后设置页里的预设选择会被收起。")) return;
                labSetEnabled(FEATURE, false);
            };
        } else {
            ac.innerHTML = '<button class="lab-btn primary" type="button" id="labOn-gp">🔒 输入口令开启</button>';
            ac.querySelector("#labOn-gp").onclick = function () {
                if (labAskPass(FEATURE, NAME)) location.href = "settings.html";
            };
        }
    }

    Lab.register({ id: FEATURE, title: "🎮 " + NAME, render: render });
})();

// ---------- 模块：功能版本总览 ----------
(function () {
    function render(el) {
        el.innerHTML =
            '<div class="lab-meta">' +
            '  <span class="lab-state" id="labVerState"></span>' +
            '</div>' +
            '<div class="lab-desc" id="labVerDesc"></div>' +
            '<div class="lab-actions">' +
            '  <button class="lab-btn primary" type="button" id="labVerGo">🏷️ 查看各功能版本</button>' +
            '</div>';

        paint(el);
        el.querySelector("#labVerGo").onclick = function () {
            location.href = "dict/versions.html";
        };
        versionOnChange(function () {
            if (document.body.contains(el)) paint(el);
        });
    }

    function paint(el) {
        var st = el.querySelector("#labVerState");
        var desc = el.querySelector("#labVerDesc");
        var ids = Object.keys(FEATURE_VERSIONS);
        if (!ids.length) {
            st.className = "lab-state off";
            st.innerText = "暂无登记";
            desc.innerText = "还没有登记任何实验功能版本。";
            return;
        }

        var totalV = 0, totalOk = 0;
        ids.forEach(function (id) {
            totalV += featVersionList(id).length;
            totalOk += featVersionValidCount(id);
        });

        st.className = "lab-state on";
        st.innerText = ids.length + " 个功能 · " + totalV + " 个版本";

        desc.innerHTML =
            "每个实验功能各自维护一条版本线（当前 " + ids.length + " 个功能，共 " + totalV +
            " 个版本，其中 " + totalOk + " 个仍在 90 天有效期内）。<br>" +
            "切换只在同一个功能自己的有效版本之间进行。";
    }

    Lab.register({ id: "versions", title: "🏷️ 功能版本", render: render });
})();

Lab.renderAll();
</script>
<script src="dict/sidebar.js?v=20261016"></script>
</body>
