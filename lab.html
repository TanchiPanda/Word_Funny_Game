<div id="labRoot"></div>

<script>
// ===== 实验室：模块注册表 =====
// 后续每个试验功能写成 { id, title, render(el) }，
// 用 Lab.register(...) 注册即可自动渲染，不用改本页结构。
window.Lab = (function () {
    const modules = [];

    function register(mod) {
        if (!mod || !mod.id || typeof mod.render !== "function") {
            console.warn("[Lab] 模块格式不对，已忽略：", mod);
            return;
        }
        if (modules.some(m => m.id === mod.id)) {
            console.warn("[Lab] 模块 id 重复，已忽略：" + mod.id);
            return;
        }
        modules.push(mod);
    }

    var GROUP_LABEL = {
        active: "🧪 实验中的功能",
        graduated: "🗂️ 以前实验过",
        meta: "🏷️ 版本管理"
    };

    function renderAll() {
        const root = document.getElementById("labRoot");
        root.innerHTML = "";

        if (!modules.length) {
            root.innerHTML =
                '<div class="empty-state">' +
                '  <div class="empty-icon"><img class="inline-icon" src="site-icon/flask.svg" alt="" /> </div>' +
                '  <div class="empty-title">还没有实验项目</div>' +
                '  <div class="empty-hint">这里将陆续放入试验性功能<br>当前为空白页面</div>' +
                '</div>';
            return;
        }

        // 按栏目归拢：同一栏目只出一个标题，注册顺序不影响分组
        var GROUP_ORDER = ["active", "graduated", "meta"];
        var ordered = modules.slice().sort(function (a, b) {
            var ra = GROUP_ORDER.indexOf(a.group || "active");
            var rb = GROUP_ORDER.indexOf(b.group || "active");
            if (ra < 0) ra = GROUP_ORDER.length;
            if (rb < 0) rb = GROUP_ORDER.length;
            return ra - rb;
        });

        var lastGroup = null;
        ordered.forEach(mod => {
            const g = mod.group || "active";
            if (g !== lastGroup) {
                lastGroup = g;
                const head = document.createElement("div");
                head.className = "lab-section " + g;
                head.innerText = GROUP_LABEL[g] || g;
                root.appendChild(head);
            }
            const card = document.createElement("div");
            card.className = "lab-card";
            card.id = "lab-" + mod.id;
            if (mod.title) {
                const t = document.createElement("div");
                t.className = "lab-card-title";
                t.innerHTML = mod.title;
                card.appendChild(t);
            }
            const body = document.createElement("div");
            card.appendChild(body);
            root.appendChild(card);
            try {
                mod.render(body);
            } catch (e) {
                body.innerHTML = '<div style="color:#ff8888;font-size:13px;">模块加载失败：' + (e.message || e) + '</div>';
            }
        });
    }

    return { register, renderAll, modules };
})();

// ===== 启动 =====
// ---------- 模块：下载词典 ----------
(function () {
    var FEATURE = "downloadDict";
    var NAME = "下载词典";

    function render(el) {
        el.innerHTML =
            '<div class="lab-meta">' +
            '  <span class="lab-badge">实验功能</span>' +
            '  <span class="lab-state" id="labState-dl"></span>' +
            '</div>' +
            '<div class="lab-desc">把当前词书导出成 CSV，或者生成英语列留空的默写版打印手写。</div>' +
            '<div class="lab-ver" id="labVerLine-dl"></div>' +
            '<div class="lab-actions" id="labActions-dl"></div>';

        paint(el);
        labOnChange(function () {
            if (document.body.contains(el)) paint(el);
        });
        versionOnChange(function () {
            if (document.body.contains(el)) paint(el);
        });
    }

    // 该功能自己的版本信息（与其他实验功能互不相干）
    function paintVersion(el) {
        var box = el.querySelector("#labVerLine-dl");
        var v = featVersionGetActive(FEATURE);
        if (!v) { box.innerHTML = ""; return; }
        var left = featVersionDaysLeft(v);
        var leftText = (left === Infinity) ? "永久有效"
            : (left <= 0 ? "已过期" : "剩余 " + left + " 天");
        box.innerHTML =
            '<span class="ver-tag">该功能版本 <b>' + v.version + '</b></span>' +
            '<span class="badge-mini ' + versionChannelClass(v.channel) + '">' + versionChannelLabel(v.channel) + '</span>' +
            '<span class="ver-left' + (left <= 0 ? " dead" : "") + '">' + leftText + '</span>' +
            '<button class="ver-link" type="button" id="labVerGo-dl">版本记录</button>';
        box.querySelector("#labVerGo-dl").onclick = function () {
            location.href = "dict/versions.html?f=" + encodeURIComponent(FEATURE);
        };
    }

    function paint(el) {
        var on = labEnabled(FEATURE);
        var st = el.querySelector("#labState-dl");
        var ac = el.querySelector("#labActions-dl");

        paintVersion(el);

        st.className = "lab-state " + (on ? "on" : "off");
        st.innerText = on ? "已开启" : "未开启";

        if (on) {
            ac.innerHTML =
                '<button class="lab-btn primary" type="button" id="labGo-dl"><img class="inline-icon" src="site-icon/download.svg" alt="" /> 进入下载页</button>' +
                '<button class="lab-btn" type="button" id="labOff-dl">关闭该功能</button>';
            ac.querySelector("#labGo-dl").onclick = function () {
                location.href = "dict/download.html";
            };
            ac.querySelector("#labOff-dl").onclick = function () {
                if (!confirm("确定关闭「" + NAME + "」？关闭后首页的「线下记背」会重新上锁。")) return;
                labSetEnabled(FEATURE, false);
            };
        } else {
            ac.innerHTML = '<button class="lab-btn primary" type="button" id="labOn-dl">开启该功能</button>';
            ac.querySelector("#labOn-dl").onclick = function () {
                labEnable(FEATURE, function (ok) {
                    if (ok) location.href = "dict/download.html";
                });
            };
        }
    }

    Lab.register({ id: FEATURE, title: '<img class="inline-icon" src="site-icon/download.svg" alt="" /> ' + NAME, render: render });
})();

// ---------- 模块：多选课时（稳定发行，收在「以前实验过」）----------
(function () {
    var FEATURE = "multiLevel";
    var NAME = "多选课时";

    function render(el) {
        var meta = LAB_GRADUATED[FEATURE] || {};
        el.innerHTML =
            '<div class="lab-meta">' +
            '  <span class="lab-badge stable">稳定发行</span>' +
            '  <span class="lab-state stable" id="labState-ml"></span>' +
            '</div>' +
            '<div class="lab-desc">' + (meta.note || "") + '</div>' +
            '<div class="lab-desc" style="font-size:12px;color:#9a9ac0;">' +
            '  该功能已跑完实验期，' + (meta.since ? meta.since + " 起" : "") +
            '常驻生效，不再提供开关。' +
            '</div>' +
            '<div class="lab-ver" id="labVerLine-ml"></div>' +
            '<div class="lab-actions" id="labActions-ml"></div>';

        paint(el);
        labOnChange(function () { if (document.body.contains(el)) paint(el); });
        versionOnChange(function () { if (document.body.contains(el)) paint(el); });
    }

    function paintVersion(el) {
        var box = el.querySelector("#labVerLine-ml");
        var v = featVersionGetActive(FEATURE);
        if (!v) { box.innerHTML = '<span class="ver-tag">尚未登记版本</span>'; return; }
        var left = featVersionDaysLeft(v);
        var leftText = (left === Infinity) ? "永久有效"
            : (left <= 0 ? "已过期" : "剩余 " + left + " 天");
        box.innerHTML =
            '<span class="ver-tag">该功能版本 <b>' + v.version + '</b></span>' +
            '<span class="badge-mini ' + versionChannelClass(v.channel) + '">' + versionChannelLabel(v.channel) + '</span>' +
            '<span class="ver-left' + (left <= 0 ? " dead" : "") + '">' + leftText + '</span>' +
            '<button class="ver-link" type="button" id="labVerGo-ml">版本记录</button>';
        box.querySelector("#labVerGo-ml").onclick = function () {
            location.href = "dict/versions.html?f=" + encodeURIComponent(FEATURE);
        };
    }

    function paint(el) {
        var on = labEnabled(FEATURE);
        var st = el.querySelector("#labState-ml");
        var ac = el.querySelector("#labActions-ml");

        paintVersion(el);

        st.className = "lab-state stable";
        st.innerText = "已长期开启";

        ac.innerHTML = '<button class="lab-btn primary" type="button" id="labGo-ml"><img class="inline-icon" src="site-icon/books.svg" alt="" /> 去选课时页多选</button>';
        ac.querySelector("#labGo-ml").onclick = function () {
            location.href = "dict/chooser.html";
        };
    }

    Lab.register({ id: FEATURE, title: '<img class="inline-icon" src="site-icon/books.svg" alt="" /> ' + NAME, group: "graduated", render: render });
})();

// ---------- 模块：连连看游戏参数 ----------
(function () {
    var FEATURE = "gameParams";
    var NAME = "连连看游戏参数";

    function render(el) {
        el.innerHTML =
            '<div class="lab-meta">' +
            '  <span class="lab-badge">实验功能</span>' +
            '  <span class="lab-state" id="labState-gp"></span>' +
            '</div>' +
            '<div class="lab-desc">在设置页挑选连连看的玩法预设：A 预设（难度，4 个）、B 预设（形式：天堂／挑战赛／计时赛／综合赛）、C 预设（自定义：图标／名称／描述与全部玩法参数都能自己调，支持图形编辑和代码编辑）三组互斥，选中哪组就用哪组，改完即时生效。</div>' +
            '<div class="lab-ver" id="labVerLine-gp"></div>' +

        paint(el);
        labOnChange(function () { if (document.body.contains(el)) paint(el); });
        versionOnChange(function () { if (document.body.contains(el)) paint(el); });
    }

    function paintVersion(el) {
        var box = el.querySelector("#labVerLine-gp");
        var v = featVersionGetActive(FEATURE);
        if (!v) { box.innerHTML = '<span class="ver-tag">尚未登记版本</span>'; return; }
        var left = featVersionDaysLeft(v);
        var leftText = (left === Infinity) ? "永久有效"
            : (left <= 0 ? "已过期" : "剩余 " + left + " 天");
        box.innerHTML =
            '<span class="ver-tag">该功能版本 <b>' + v.version + '</b></span>' +
            '<span class="badge-mini ' + versionChannelClass(v.channel) + '">' + versionChannelLabel(v.channel) + '</span>' +
            '<span class="ver-left' + (left <= 0 ? " dead" : "") + '">' + leftText + '</span>' +
            '<button class="ver-link" type="button" id="labVerGo-gp">版本记录</button>';
        box.querySelector("#labVerGo-gp").onclick = function () {
            location.href = "dict/versions.html?f=" + encodeURIComponent(FEATURE);
        };
    }

    function paint(el) {
        var on = labEnabled(FEATURE);
        var st = el.querySelector("#labState-gp");
        var ac = el.querySelector("#labActions-gp");

        paintVersion(el);

        st.className = "lab-state " + (on ? "on" : "off");
        st.innerText = on ? "已开启" : "未开启";

        if (on) {
            ac.innerHTML =
                '<button class="lab-btn primary" type="button" id="labGo-gp"><img class="inline-icon" src="site-icon/gamepad.svg" alt="" /> 去设置页调整</button>' +
                '<button class="lab-btn" type="button" id="labOff-gp">关闭该功能</button>';

                location.href = "settings.html";

                labSetEnabled(FEATURE, false);

            ac.innerHTML = '<button class="lab-btn primary" type="button" id="labOn-gp">开启该功能</button>';

// ---------- 模块：功能版本总览 ----------
(function () {
    function render(el) {
        el.innerHTML =
            '<div class="lab-meta">' +
            '  <span class="lab-state" id="labVerState"></span>' +
            '</div>' +
            '<div class="lab-desc" id="labVerDesc"></div>' +
            '<div class="lab-actions">' +
            '  <button class="lab-btn primary" type="button" id="labVerGo"><img class="inline-icon" src="site-icon/tag.svg" alt="" /> 查看各功能版本</button>' +
            '</div>';

        paint(el);
        el.querySelector("#labVerGo").onclick = function () {
            location.href = "dict/versions.html";
        };
        versionOnChange(function () {
            if (document.body.contains(el)) paint(el);
        });
    }

    function paint(el) {
        var st = el.querySelector("#labVerState");
        var desc = el.querySelector("#labVerDesc");
        var ids = Object.keys(FEATURE_VERSIONS);
        if (!ids.length) {
            st.className = "lab-state off";
            st.innerText = "暂无登记";
            desc.innerText = "还没有登记任何实验功能版本。";
            return;
        }

        var totalV = 0, totalOk = 0;
        ids.forEach(function (id) {
            totalV += featVersionList(id).length;
            totalOk += featVersionValidCount(id);
        });

        st.className = "lab-state on";
        st.innerText = ids.length + " 个功能 · " + totalV + " 个版本";

        desc.innerHTML =
            "每个实验功能各自维护一条版本线（当前 " + ids.length + " 个功能，共 " + totalV +
            " 个版本，其中 " + totalOk + " 个仍在有效期内）。<br>" +
            "切换只在同一个功能自己的有效版本之间进行。";
    }

    Lab.register({ id: "versions", title: "🏷️ 功能版本", group: "meta", render: render });
})();

// 公约确认状态：确认过就显示时间，并提供重新阅读
function renderConventionLine() {
    var box = document.getElementById("labCvLine");
    if (!box) return;
    var agreedTxt = "";
    try {
        var o = JSON.parse(localStorage.getItem(LAB_AGREE_KEY) || "null");
        if (o && o.doc === LAB_CONVENTION.url && o.t) {
            var d = new Date(o.t);
            agreedTxt = "已确认 · " + d.getFullYear() + "-" +
                String(d.getMonth() + 1).padStart(2, "0") + "-" +
                String(d.getDate()).padStart(2, "0");
        }
    } catch (e) {}
    box.innerHTML =
        '<span>' + (agreedTxt ? "📖 《实验室公约》" + agreedTxt : "📖 还没读过《实验室公约》") + '</span>' +
        '<span>' +
        '  <a href="' + LAB_CONVENTION.url + '" target="_blank" rel="noopener">打开公约</a>' +
        (agreedTxt ? '  <button type="button" id="labCvForget">重新阅读</button>' : "") +
        '</span>';
    var f = box.querySelector("#labCvForget");
    if (f) f.onclick = function () {
        if (!confirm("忘掉公约确认？下次开启实验功能时会重新要求阅读。")) return;
        labForgetAgreed();
        renderConventionLine();
    };
}
if (typeof labOnChange === "function") labOnChange(renderConventionLine);
renderConventionLine();

Lab.renderAll();
</script>
