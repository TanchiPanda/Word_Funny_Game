<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🧪 实验室</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg,#1a1040 0%,#2d1b5e 50%,#1a1040 100%);
    min-height: 100vh;
    color: #fff;
    padding: 16px;
    padding-bottom: 40px;
}
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.back-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
}
.back-btn:active { transform: scale(0.95); }
.page-title {
    font-size: 15px;
    color: #a8a8d8;
    letter-spacing: 1px;
}

/* 顶部介绍卡 */
.intro-card {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(78,205,196,0.25);
    border-radius: 18px;
    padding: 20px 18px;
    margin-bottom: 16px;
}
.intro-title {
    font-size: 20px;
    font-weight: bold;
    color: #4ecdc4;
    margin-bottom: 8px;
}
.intro-desc {
    font-size: 14px;
    color: #a8a8d8;
    line-height: 1.7;
}

/* 模块挂载区 */
#labRoot {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* 空状态 */
.empty-state {
    border: 1.5px dashed rgba(255,255,255,0.18);
    border-radius: 16px;
    padding: 44px 20px;
    text-align: center;
}
.empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.7;
}
.empty-title {
    font-size: 15px;
    color: #e8e8f5;
    margin-bottom: 6px;
}
.empty-hint {
    font-size: 13px;
    color: #7f7fa8;
    line-height: 1.7;
}

/* 通用实验室卡片（供后续模块复用） */
.lab-card {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 18px;
}
.lab-card-title {
    font-size: 16px;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">← 返回</button>
    <div class="page-title">🧪 实验室</div>
</div>

<div class="intro-card">
    <div class="intro-title">🧪 实验室</div>
    <div class="intro-desc">
        试验性功能都放在这里。目前是空的，等着往里装东西。
    </div>
</div>

<!-- 模块挂载点：后续功能直接往这里 append -->
<div id="labRoot"></div>

<script src="dict/wbook.js?v=20261016"></script>
<script src="dict/sync.js?v=20261016"></script>
<script src="dict/msauth.js?v=20261016"></script>
<script src="dict/auth.js?v=20261016"></script>
<script>
// ===== 实验室：模块注册表 =====
// 后续每个试验功能写成 { id, title, render(el) }，
// 用 Lab.register(...) 注册即可自动渲染，不用改本页结构。
window.Lab = (function () {
    const modules = [];

    function register(mod) {
        if (!mod || !mod.id || typeof mod.render !== "function") {
            console.warn("[Lab] 模块格式不对，已忽略：", mod);
            return;
        }
        if (modules.some(m => m.id === mod.id)) {
            console.warn("[Lab] 模块 id 重复，已忽略：" + mod.id);
            return;
        }
        modules.push(mod);
    }

    function renderAll() {
        const root = document.getElementById("labRoot");
        root.innerHTML = "";

        if (!modules.length) {
            root.innerHTML =
                '<div class="empty-state">' +
                '  <div class="empty-icon">🧪</div>' +
                '  <div class="empty-title">还没有实验项目</div>' +
                '  <div class="empty-hint">这里将陆续放入试验性功能<br>当前为空白页面</div>' +
                '</div>';
            return;
        }

        modules.forEach(mod => {
            const card = document.createElement("div");
            card.className = "lab-card";
            card.id = "lab-" + mod.id;
            if (mod.title) {
                const t = document.createElement("div");
                t.className = "lab-card-title";
                t.innerText = mod.title;
                card.appendChild(t);
            }
            const body = document.createElement("div");
            card.appendChild(body);
            root.appendChild(card);
            try {
                mod.render(body);
            } catch (e) {
                body.innerHTML = '<div style="color:#ff8888;font-size:13px;">模块加载失败：' + (e.message || e) + '</div>';
            }
        });
    }

    return { register, renderAll, modules };
})();

// ===== 启动 =====
Lab.renderAll();
</script>
<script src="dict/sidebar.js?v=20261016"></script>
</body>
</html>
