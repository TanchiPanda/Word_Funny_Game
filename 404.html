<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="site-icon/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面不存在</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffd93d 0%, #ffb347 50%, #ffcc33 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .container {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 60px 50px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    max-width: 560px;
    width: 100%;
  }
  h1 {
    font-size: 72px;
    font-weight: 800;
    color: #4a3520;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  p {
    font-size: 18px;
    color: #5c4423;
    margin-bottom: 36px;
    line-height: 1.6;
    word-break: break-all;
  }
  .filename {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    background: rgba(74, 53, 32, 0.12);
    border-radius: 6px;
    font-family: "SF Mono", Consolas, "Courier New", monospace;
    font-size: 16px;
    color: #4a3520;
  }
  .home-btn {
    display: inline-block;
    padding: 14px 40px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(135deg, #43c463 0%, #2e8b57 50%, #1e7d46 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(46, 139, 87, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .home-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(46, 139, 87, 0.55);
  }
  .home-btn:active { transform: translateY(0); }
  @media (max-width: 480px) {
    h1 { font-size: 48px; }
    p { font-size: 16px; }
    .container { padding: 40px 25px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p id="msg">您访问的页面不存在。</p>
    <a class="home-btn" href="index.html">返回首页</a>
  </div>
  <script>
    (function () {
      var path = decodeURIComponent(location.pathname || "");
      var last = path.replace(/\/+$/, "").split("/").pop() || "";
      var msg = document.getElementById("msg");
      if (/\.html?$/i.test(last)) {
        msg.innerHTML = '<span class="filename">' + last.replace(/</g, "&lt;") + '</span><br>不存在';
      } else if (path && path !== "/") {
        msg.textContent = "您访问的地址「" + path + "」不存在。";
      } else {
        msg.textContent = "您访问的页面不存在。";
      }
    })();
  </script>
</body>
</html>
