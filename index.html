<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate">
    <title>单词闯关连连看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,#2c1b54,#422880,#201440);
            padding: 20px 12px 40px;
            text-align: center;
            overflow-x: hidden;
            color: #fff;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 24px;
            background: linear-gradient(90deg,#ffd700,#ff6b6b,#4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.4;
        }
        .tip-info {
            color:#ccccdd;
            margin-bottom:16px;
            font-size:16px;
        }
        .page { display:none; }
        .page.active { display:block; }
        /* ========== 选词页顶部栏（标题 + 右上角课时选择） ========== */
        .select-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .select-header h2 { margin-bottom: 0; }
        .level-select-wrap {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,215,0,0.45);
            border-radius: 12px;
            padding: 8px 12px;
        }
        .level-select-wrap label {
            font-size: 14px;
            color: #ffd700;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        #levelSelect {
            padding: 7px 10px;
            border-radius: 8px;
            border: 1.5px solid rgba(255,215,0,0.5);
            background: #2c1b54;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            min-width: 118px;
        }
        #levelSelect option { background: #2c1b54; color: #fff; }
        @media (max-width: 640px) {
            .select-header { flex-direction: column; gap: 12px; }
            .level-select-wrap { position: static; transform: none; }
        }
        /* ========== 选词页 ========== */
        .word-tag-wrap {
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 24px 16px;
            margin: 20px 0;
            max-height: 38vh;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .word-tag {
            padding: 12px 16px;
            background: rgba(78,205,196,0.25);
            border: 2px solid #4ecdc4;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .word-tag:hover { transform: scale(1.03); }
        .word-tag.remove {
            background: rgba(255,107,107,0.2);
            border-color: #ff6b6b;
            color: #bbbbbb;
            text-decoration: line-through;
        }
        /* ========== 最佳用时排行榜 ========== */
        .leaderboard {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 16px;
            padding: 18px 14px;
            margin: 20px 0;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }
        .leaderboard-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 14px;
            letter-spacing: 2px;
        }
        .leaderboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .leaderboard-item {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 10px 8px;
            text-align: center;
        }
        .leaderboard-item .mode-name {
            font-size: 12px;
            color: #a8a8d8;
            margin-bottom: 5px;
        }
        .leaderboard-item .best-time {
            font-size: 18px;
            font-weight: bold;
            color: #4ecdc4;
        }
        .leaderboard-item .best-words {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
        .leaderboard-item .best-time.no-record {
            color: #666;
            font-size: 13px;
        }
        .leaderboard-clear {
            margin-top: 12px;
            padding: 7px 18px;
            border: 1px solid rgba(255,107,107,0.5);
            background: rgba(255,107,107,0.15);
            color: #ff8888;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        /* ========== 模式按钮 ========== */
        .mode-btn {
            width: 100%;
            max-width: 340px;
            padding: 16px 14px;
            border-radius: 14px;
            border: none;
            font-size: 17px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .mode-btn:active { transform: scale(0.97); }
        .heaven-btn {
            background: linear-gradient(90deg,#48c9b0,#85c1e9);
            box-shadow: 0 4px 15px rgba(72,201,176,0.35);
        }
        .simple-btn {
            background: linear-gradient(90deg,#39d98a,#4ecdc4);
            box-shadow: 0 4px 15px rgba(57,217,138,0.35);
        }
        .challenge-btn {
            background: linear-gradient(90deg,#ff6b6b,#ee4c4c);
            box-shadow: 0 4px 15px rgba(255,107,107,0.35);
        }
        .hell-btn {
            background: linear-gradient(90deg,#8b0000,#c0392b);
            box-shadow: 0 4px 15px rgba(192,57,43,0.4);
        }
        .bottom-select-area {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }
        /* ========== 游戏页 ========== */
        .tip {
            color:#ddd;
            margin-bottom:12px;
            font-size:15px;
        }
        .progress-wrap {
            width: 100%;
            height: 22px;
            background: rgba(255,255,255,0.15);
            border-radius: 11px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg,#4ecdc4,#39d98a);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-bar.time {
            background: linear-gradient(90deg,#ffd700,#ff6b6b);
        }
        .status-text {
            font-size: 17px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .two-col-wrap {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-direction: row;
            align-items: flex-start;
        }
        .col {
            width: 48%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .col-title {
            font-size: 14px;
            color: #a8a8d8;
            margin-bottom: 8px;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .item {
            padding: 14px 10px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: clamp(12px, 2.8vw, 16px);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            position: relative;
            line-height: 1.4;
        }
        .item:active { transform: scale(0.96); }
        .item.selected {
            box-shadow: 0 0 0 3px #ffd700;
            background: rgba(255,215,0,0.25);
        }
        .item.matched {
            background: rgba(57,217,138,0.35);
            border-color: #39d98a;
            transform: scale(1.02);
            pointer-events: none;
        }
        /* 地狱模式遮罩 */
        .item.hell-cover {
            color: transparent !important;
        }
        .item.hell-cover::after {
            content: "?";
            position: absolute;
            inset: 0;
            background: #601818;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ff8888;
            font-weight: bold;
            z-index: 10;
        }
        .bottom-btn-area {
            margin-top: 28px;
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .game-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            min-width: 140px;
            max-width: 200px;
        }
        .reset-btn { background: linear-gradient(90deg,#ff6b6b,#ee4c4c); }
        .home-back-btn { background: linear-gradient(90deg,#6c5ce7,#a29bfe); }
        /* ========== 全局音效开关 ========== */
        .sound-toggle {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 999;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 44px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1.5px solid rgba(255,215,0,0.5);
            background: rgba(44,27,84,0.88);
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }
        .sound-toggle:active { transform: scale(0.95); }
        .sound-toggle svg { display: block; }
        .sound-toggle.off {
            color: #a8a8d8;
            border-color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ========== 全局音效开关（固定左上角，所有页面可用） ========== -->
    <button id="soundToggle" class="sound-toggle" type="button" onclick="toggleSound()" aria-label="音效开关" title="点击开启或关闭音效"></button>
<!-- ========== 单词剔除选词页（默认首页，无密码） ========== -->
    <div id="selectPage" class="page active">
        <div class="select-header">
            <h2>📚 剔除你不需要练习的单词</h2>
            <div class="level-select-wrap">
                <label for="levelSelect">课时</label>
                <select id="levelSelect" aria-label="课时选择"></select>
            </div>
        </div>
        <div class="tip-info" id="selectTip">默认本课时全部单词都将加入游戏，点击单词即可剔除（划掉）</div>
        <div class="word-tag-wrap" id="tagBox"></div>
        <!-- 最佳用时排行榜 -->
        <div class="leaderboard">
            <div class="leaderboard-title" id="leaderboardTitle">🏆 最佳用时排行榜</div>
            <div class="leaderboard-grid" id="leaderboardGrid"></div>
            <button class="leaderboard-clear" onclick="clearLeaderboard()">清除全部记录</button>
        </div>
        <div class="bottom-select-area">
            <button class="mode-btn heaven-btn" onclick="startGame('heaven')">☁️ 天堂模式</button>
            <button class="mode-btn simple-btn" onclick="startGame('easy')">🟢 简单模式</button>
            <button class="mode-btn challenge-btn" onclick="startGame('race')">🔴 挑战模式</button>
            <button class="mode-btn hell-btn" onclick="startGame('hell')">💀 地狱模式</button>
        </div>
    </div>
    <!-- ========== 连连看游戏页 ========== -->
    <div id="gamePage" class="page">
        <h2>单词配对游戏</h2>
        <div class="tip">✅ 可自由先点英文或者中文进行配对</div>
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText"></div>
        <div class="two-col-wrap">
            <div class="col">
                <div class="col-title">🔤 ENGLISH</div>
                <div id="enBox"></div>
            </div>
            <div class="col">
                <div class="col-title">📖 中文释义</div>
                <div id="cnBox"></div>
            </div>
        </div>
        <div class="bottom-btn-area">
            <button class="game-btn reset-btn" id="resetBtn">🔄 重置本局</button>
            <button class="game-btn home-back-btn" onclick="backToSelect()">🏠 返回选词页</button>
        </div>
    </div>
</div>
<script>
// ===== 音效系统（全部离线生成）=====
let audioCtx = null;
// ===== 音效开关（设置持久化到 localStorage）=====
let soundEnabled = (localStorage.getItem("wordGameSoundEnabled") !== "0");
const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>';
const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon><line x1="16" y1="9" x2="22" y2="15"></line><line x1="22" y1="9" x2="16" y2="15"></line></svg>';
function updateSoundBtn() {
    const btn = document.getElementById("soundToggle");
    if (!btn) return;
    btn.classList.toggle("off", !soundEnabled);
    btn.innerHTML = (soundEnabled ? ICON_SOUND_ON + "<span>音效开</span>" : ICON_SOUND_OFF + "<span>音效关</span>");
}
function toggleSound() {
    soundEnabled = !soundEnabled;
    localStorage.setItem("wordGameSoundEnabled", soundEnabled ? "1" : "0");
    updateSoundBtn();
    if (soundEnabled) playClickSound();
}
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function playClickSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 800; osc.type = 'square';
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.08);
    } catch(e) {}
}
function playSuccessSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.3);
            osc.start(ctx.currentTime + i * 0.1); osc.stop(ctx.currentTime + i * 0.1 + 0.3);
        });
    } catch(e) {}
}
function playErrorSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
        osc.type = 'sawtooth';
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.35);
    } catch(e) {}
}

function playWinSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const notes = [523, 587, 659, 698, 784, 880, 988, 1047];
        notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.3);
            osc.start(ctx.currentTime + i * 0.1); osc.stop(ctx.currentTime + i * 0.1 + 0.3);
        });
    } catch(e) {}
}

        sel.appendChild(opt);
    });
    sel.value = String(currentLevel);
    sel.onchange = () => switchLevel(Number(sel.value));
    renderWordTags();
    renderLeaderboard();
}
function switchLevel(idx) {
    playClickSound();
    currentLevel = idx;
    document.getElementById("levelSelect").value = String(currentLevel);
    renderWordTags();
    renderLeaderboard();
}
function getRemovedList() {
    if (!removedMap[currentLevel]) removedMap[currentLevel] = [];
    return removedMap[currentLevel];
}
function renderWordTags() {
    const box = document.getElementById("tagBox");
    box.innerHTML = "";
    const removed = getRemovedList();
    activeWordList().forEach((word, idx) => {
        const tag = document.createElement("div");
        tag.className = "word-tag" + (removed.includes(idx) ? " remove" : "");
        tag.innerText = word.en;
        tag.dataset.index = idx;
        tag.onclick = () => { playClickSound(); toggleRemove(tag, idx); };
        box.appendChild(tag);
    });
    const tip = document.getElementById("selectTip");
    if (tip) tip.innerText = "当前 " + LEVELS[currentLevel].name + "（共" + activeWordList().length + "词）：默认全部加入游戏，点击单词即可剔除（划掉）";
}
function toggleRemove(dom, index) {
    const removed = getRemovedList();
    if (dom.classList.contains("remove")) {
        dom.classList.remove("remove");
        removedMap[currentLevel] = removed.filter(i => i !== index);
    } else {
        dom.classList.add("remove");
        removedMap[currentLevel] = removed.concat([index]);
    }
}
// ===== 最佳用时排行榜（修复版：按模式独立存储，不掺单词数量）=====
function getRecordKey(mode) {
    return "wordGameBest_L" + currentLevel + "_" + mode;
}
function getRecord(mode) {
    const raw = localStorage.getItem(getRecordKey(mode));
    if (!raw) return null;
    try {
        return JSON.parse(raw);
    } catch(e) {
        return { time: parseFloat(raw), words: activeWordList().length };
    }
}
function saveRecord(mode, time, words) {
    localStorage.setItem(getRecordKey(mode), JSON.stringify({time: time, words: words}));
}
function renderLeaderboard() {
    const grid = document.getElementById("leaderboardGrid");
    const titleEl = document.getElementById("leaderboardTitle");
    if (titleEl) titleEl.innerText = "🏆 最佳用时排行榜 · " + LEVELS[currentLevel].name;
    grid.innerHTML = "";
    const modes = ["heaven", "easy", "race", "hell"];
    modes.forEach(mode => {
        const record = getRecord(mode);
        const item = document.createElement("div");
        item.className = "leaderboard-item";
        if (record) {
            item.innerHTML = '<div class="mode-name">' + modeNames[mode] + '</div>' +
                             '<div class="best-time">' + record.time + '秒</div>' +
                             '<div class="best-words">(' + record.words + '词)</div>';
        } else {
            item.innerHTML = '<div class="mode-name">' + modeNames[mode] + '</div>' +
                             '<div class="best-time no-record">暂无记录</div>';
        }
        grid.appendChild(item);
    });
}
function clearLeaderboard() {
    if (confirm("确定要清除全部最佳用时记录吗？")) {
        Object.keys(localStorage).forEach(key => {
            if (key.startsWith("wordGameBest_")) {
                localStorage.removeItem(key);
            }
        });
        renderLeaderboard();
    }
}
// ===== 开始游戏 =====
function startGame(mode) {
    playClickSound();
    gameMode = mode;
    keptWords = [];
    const removed = getRemovedList();
    activeWordList().forEach((word, idx) => {
        if (!removed.includes(idx)) keptWords.push(word);
    });
    if (keptWords.length === 0) {
        alert("所有单词都被剔除了！至少保留一个单词才能开始游戏");
        return;
    }
    hellOpenCards = [];
    startMatchGame();
}
function shuffle(arr) {
    let temp = [...arr];
    for (let i = temp.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [temp[i], temp[j]] = [temp[j], temp[i]];
    }
    return temp;
}
function startMatchGame() {
    showPage("gamePage");
    selectedItem = null;
    clearInterval(timer);
    gameStartTime = Date.now();
    let enBox = document.getElementById("enBox");
    let cnBox = document.getElementById("cnBox");
    enBox.innerHTML = "";
    cnBox.innerHTML = "";
    let enList, cnList;
    if (gameMode === 'heaven') {
        enList = [...keptWords];
        cnList = [...keptWords];
    } else {
        enList = shuffle(keptWords);
        cnList = shuffle(keptWords);
    }
    enList.forEach(word => {
        let div = document.createElement("div");
        div.className = "item";
        if (gameMode === 'hell') div.classList.add('hell-cover');
        div.innerText = word.en;
        div.dataset.en = word.en;
        div.onclick = () => clickCard(div);
        enBox.appendChild(div);
    });
    cnList.forEach(word => {
        let div = document.createElement("div");
        div.className = "item";
        if (gameMode === 'hell') div.classList.add('hell-cover');
        div.innerText = word.cn;
        div.dataset.en = word.en;
        div.onclick = () => clickCard(div);
        cnBox.appendChild(div);
    });
    document.getElementById("resetBtn").onclick = () => { playClickSound(); startGame(gameMode); };
    document.getElementById("statusText").innerText = LEVELS[currentLevel].name + " · 请开始配对单词（共" + keptWords.length + "组）";
    document.getElementById("progressBar").style.width = "0%";
    if (gameMode === "race") {
        let totalTime = keptWords.length * 5;
        let left = totalTime;
        let bar = document.getElementById("progressBar");
        bar.classList.add("time");
        timer = setInterval(() => {
            left--;
            bar.style.width = (left / totalTime * 100) + "%";
            document.getElementById("statusText").innerText = "剩余时间：" + left + "秒";
            if (left <= 0) {
                clearInterval(timer);
                playErrorSound();
                alert("⏰ 时间结束！挑战失败");
                backToSelect();
            }
        }, 1000);
    } else {
        document.getElementById("progressBar").classList.remove("time");
    }
}

function getActiveHellOpenCards(){
    return hellOpenCards.filter(dom => !dom.classList.contains("matched"));
}

function clickCard(dom) {
    if (dom.classList.contains("matched")) return;
    if (gameMode === 'hell') {
        if (!dom.classList.contains('hell-cover')) {
            clickSelectItem(dom);
            return;
        }
        const activeList = getActiveHellOpenCards();
        if (activeList.length >= MAX_OPEN) {
            document.getElementById("statusText").innerText = "⚠️ 最多同时翻开6张，请等待卡片闭合";
            return;
        }
        playClickSound();
        dom.classList.remove('hell-cover');
        hellOpenCards.push(dom);
        setTimeout(() => {
            if (!dom.classList.contains('matched')) {
                dom.classList.add('hell-cover');
                hellOpenCards = hellOpenCards.filter(x => x !== dom);
            }
        }, HELL_DELAY);
    } else {
        playClickSound();
        clickSelectItem(dom);
    }
}
// ===== 双向点击配对 =====
function clickSelectItem(dom) {
    if (!selectedItem) {
        document.querySelectorAll(".item").forEach(i => i.classList.remove("selected"));
        selectedItem = dom;
        dom.classList.add("selected");
    } else {
        if (selectedItem === dom) {
            selectedItem.classList.remove("selected");
            selectedItem = null;
            return;
        }
        if (selectedItem.dataset.en === dom.dataset.en) {
            selectedItem.classList.add("matched");
            dom.classList.add("matched");
            selectedItem.classList.remove("selected");
            selectedItem = null;
            playSuccessSound();
            checkWin();
        } else {
            playErrorSound();
            alert("❌ 配对错误，请重试");
            selectedItem.classList.remove("selected");
            selectedItem = null;
        }
    }
}
// ===== 通关检测 + 最佳用时记录 =====
function checkWin() {
    let matchedCount = document.querySelectorAll(".item.matched").length / 2;
    let total = keptWords.length;
    document.getElementById("progressBar").style.width = (matchedCount / total * 100) + "%";
    if (matchedCount === total) {
        clearInterval(timer);
        playWinSound();
        let usedMs = Date.now() - gameStartTime;
        let usedSec = (usedMs / 1000).toFixed(1);
        let wordCount = keptWords.length;
        let oldRecord = getRecord(gameMode);
        let isNewRecord = false;
        if (!oldRecord || Number(usedSec) < Number(oldRecord.time)) {
            saveRecord(gameMode, usedSec, wordCount);
            isNewRecord = true;
        }
        setTimeout(() => {
            if (isNewRecord) {
                alert("🎉恭喜！所有单词配对闯关成功！\n本局用时：" + usedSec + "秒（" + wordCount + "词）\n✨刷新新纪录！太棒啦！");
            } else {
                alert("🎉恭喜！所有单词配对闯关成功！\n本局用时：" + usedSec + "秒（" + wordCount + "词）\n历史最佳：" + oldRecord.time + "秒（" + oldRecord.words + "词）");
            }
            backToSelect();
        }, 600);
    }
}
function backToSelect() {
    playClickSound();
    clearInterval(timer);
    renderLeaderboard();
    showPage("selectPage");
}
// ===== 启动：直接进入选词（划词）页 =====
updateSoundBtn();
initLevels();
</script>
