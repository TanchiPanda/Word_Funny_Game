<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate">
    <title>单词闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,#2c1b54,#422880,#201440);
            padding: 20px 12px 40px;
            text-align: center;
            overflow-x: hidden;
            color: #fff;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 560px;
            margin: 0 auto;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(78,205,196,0.5);
            border-radius: 20px;
            padding: 40px 24px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        .logo-title {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 12px;
            background: linear-gradient(90deg,#ffd700,#ff6b6b,#4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-title .bolt {
            background: none;
            -webkit-text-fill-color: #ffd700;
            color: #ffd700;
        }
        .sub-title {
            color: #a8a8d8;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 32px;
        }
        .entry-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            padding: 18px 20px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg,#39d98a,#4ecdc4);
            color: #0d3b2e;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(57,217,138,0.4);
            transition: transform 0.2s;
        }
        .entry-btn:active { transform: scale(0.97); }
        .entry-btn .icon {
            font-size: 24px;
        }
        .status-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 36px;
        }
        .status-box {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(78,205,196,0.45);
            border-radius: 14px;
            padding: 16px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
        }
        .status-box .status-text {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #4ecdc4;
        }
        .status-box .status-text.activated {
            color: #ffd700;
        }
        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-height: 58px;
            padding: 14px 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg,#ffd700,#ff9500);
            color: #222;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,215,0,0.35);
            transition: transform 0.2s;
        }
        .login-btn:active { transform: scale(0.96); }
        .login-btn.hidden { display: none; }
        .footnote {
            margin-top: 26px;
            font-size: 13px;
            color: #8888aa;
            line-height: 1.8;
        }
        /* ========== 右下角设置入口 ========== */
        .settings-toggle {
            position: fixed;
            bottom: 14px;
            right: 14px;
            z-index: 999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,215,0,0.5);
            background: rgba(44,27,84,0.88);
            color: #ffd700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }
        .settings-toggle:active { transform: scale(0.92) rotate(30deg); }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-title"><span class="bolt">⚡</span> 单词闯关 <span class="bolt">⚡</span></div>
    <div class="sub-title">英文单词配对闯关小游戏</div>

    <!-- 第一个按钮：进入游戏（match.html） -->
    <button class="entry-btn" type="button" onclick="enterGame()">
        <span class="icon">📚</span> 单词闯关连连看
    </button>

    <!-- 底部状态区：左侧身份状态，右侧登录（未登录时显示） -->
    <div class="status-area">
        <div class="status-box">
            <span class="status-text" id="statusText">👤 客人模式</span>
        </div>
        <div class="status-box">
            <button class="login-btn" id="loginBtn" type="button" onclick="goLogin()">🔑 登录</button>
            <span class="status-text activated" id="activatedText" style="display:none;">✅ 已解锁全部功能</span>
        </div>
    </div>

    <div class="footnote">登录后可解锁全部课时与特色模式</div>
</div>
<!-- 右下角设置入口 -->
<button class="settings-toggle" type="button" onclick="goSettings()" aria-label="设置" title="设置">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
</button>
<script>
// ===== 身份检测 =====
const ACCESS_KEY = "wordGameAccess";
function isActivated() {
    return localStorage.getItem(ACCESS_KEY) === "full";
}
function renderStatus() {
    const activated = isActivated();
    document.getElementById("statusText").innerText = activated ? "✅ 已解锁全部功能" : "👤 客人模式";
    document.getElementById("statusText").classList.toggle("activated", activated);
    document.getElementById("loginBtn").classList.toggle("hidden", activated);
    document.getElementById("activatedText").style.display = activated ? "" : "none";
}
function goLogin() {
    location.href = "login.html";
}
function goSettings() {
    location.href = "settings.html";
}
function enterGame() {
    location.href = "match.html";
}
// ===== 启动 =====
renderStatus();
</script>
</body>
</html>
