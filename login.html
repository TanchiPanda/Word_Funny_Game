<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词闯关 - 登录</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei","PingFang SC",-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
    body {
        min-height:100vh;
        background:linear-gradient(135deg,#2c1b54,#422880,#201440);
        padding:48px 16px 40px;
        text-align:center;
        color:#fff;
    }
    .container { max-width:420px; margin:0 auto; }
    .page-title { font-size:28px; font-weight:900; color:#ffd700; margin-bottom:24px; letter-spacing:4px; }
    .npc-static {
        width:90px; height:90px; border-radius:50%;
        background:linear-gradient(135deg,#ffd700,#ff8822);
        margin:0 auto 20px; display:flex; align-items:center; justify-content:center;
        font-size:44px; box-shadow:0 0 30px rgba(255,215,0,0.4);
    }
    .panel {
        background:rgba(255,255,255,0.08);
        border:1px solid rgba(255,215,0,0.3);
        border-radius:16px; padding:24px 20px;
        backdrop-filter:blur(10px);
    }
    .panel h2 { font-size:18px; color:#ffd700; margin-bottom:16px; }
    .field { margin-bottom:12px; text-align:left; }
    .field label { display:block; font-size:13px; color:#a8a8d8; margin-bottom:4px; }
    .field input {
        width:100%; padding:12px 14px; border-radius:10px;
        border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.25);
        color:#fff; font-size:15px; outline:none;
    }
    .field input:focus { border-color:#ffd700; }
    .primary-btn {
        width:100%; padding:13px; border-radius:10px; border:none;
        background:linear-gradient(135deg,#ffd700,#ff8822); color:#2c1b54;
        font-size:16px; font-weight:bold; cursor:pointer; margin-top:6px;
    }
    .primary-btn:active { transform:scale(0.98); }
    .primary-btn:disabled { opacity:0.5; cursor:not-allowed; }
    .link-btn {
        background:none; border:none; color:#4ecdc4;
        font-size:13px; cursor:pointer; margin-top:8px; text-decoration:underline;
    }
    .divider {
        margin:18px 0; color:#a8a8d8; font-size:13px;
        display:flex; align-items:center; gap:12px; justify-content:center;
    }
    .divider::before, .divider::after { content:""; height:1px; flex:1; background:rgba(255,255,255,0.15); }
    .oauth-row { display:flex; gap:10px; }
    .oauth-btn {
        flex:1; padding:12px; border-radius:10px; border:none;
        background:#fff; color:#222; font-size:14px; font-weight:bold; cursor:pointer;
        display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .guest-btn {
        display:block; width:100%; margin-top:16px;
        padding:13px; border-radius:10px;
        border:2px solid rgba(78,205,196,0.6); background:rgba(78,205,196,0.1);
        font-size:15px; font-weight:bold; cursor:pointer; color:#4ecdc4;
    }
    .err-text { color:#ff8888; font-size:13px; margin-top:12px; min-height:18px; }
    .ok-text { color:#39d98a; font-size:13px; margin-top:12px; min-height:18px; }
    .footnote { margin-top:24px; font-size:12px; color:#a8a8d8; line-height:1.8; }
    .footnote b { color:#ffd700; }
    .mode-toggle { font-size:13px; color:#a8a8d8; margin-bottom:14px; }
    .mode-toggle span { color:#4ecdc4; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="container">
    <div class="page-title">⚡ 单词闯关 ⚡</div>
    <div class="npc-static">🧙</div>
    <div class="panel">
        <h2 id="panelTitle">邮箱登录</h2>
        <div class="mode-toggle" id="modeToggle">
            还没有账号？<span onclick="toggleMode()">注册新账号</span>
        </div>
        <div class="field">
            <label>邮箱</label>
            <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field" id="passwordField">
            <label>密码</label>
            <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="primary-btn" id="submitBtn" onclick="submitAuth()">登录</button>
        <button class="link-btn" onclick="sendMagicLink()">或使用魔法链接登录（无需密码）</button>
        <div class="divider">— 其他方式 —</div>
        <div class="oauth-row">
            <button class="oauth-btn" onclick="loginWithGitHub()">
                <svg width="18" height="18" viewBox="0 0 16 16"><path fill="#222" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.7-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
                GitHub
            </button>
            <button class="oauth-btn" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.18-1.84H9v3.49h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.93c1.71-1.58 2.68-3.9 2.68-6.65z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.93-2.27c-.8.54-1.83.86-3.03.86-2.33 0-4.31-1.57-5.02-3.68H.96v2.35A8.99 8.99 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.98 10.73c-.18-.54-.28-1.11-.28-1.73s.1-1.19.28-1.73V4.92H.96A8.99 8.99 0 0 0 0 9c0 1.45.35 2.82.96 4.08l3.02-2.35z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0A8.99 8.99 0 0 0 .96 4.92l3.02 2.35C4.69 5.15 6.67 3.58 9 3.58z"/></svg>
                Google
            </button>
        </div>
        <div class="err-text" id="errText"></div>
        <div class="ok-text" id="okText"></div>
    </div>
    <button class="guest-btn" onclick="enterGuest()">👤 以客人身份体验</button>
    <div class="footnote">
        客人模式仅可体验 <b>前 3 课时</b>与<b>简单模式</b>；<br>
        登录后可体验<b>全部课时</b>。
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="dict/auth.js?v=20260930"></script>
<script>
let isRegisterMode = false;
function toggleMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById("panelTitle").textContent = isRegisterMode ? "注册账号" : "邮箱登录";
    document.getElementById("submitBtn").textContent = isRegisterMode ? "注册" : "登录";
    document.getElementById("modeToggle").innerHTML = isRegisterMode
        ? '已有账号？<span onclick="toggleMode()">直接登录</span>'
        : '还没有账号？<span onclick="toggleMode()">注册新账号</span>';
    clearMsgs();
}
function clearMsgs() {
    document.getElementById("errText").textContent = "";
    document.getElementById("okText").textContent = "";
}
async function submitAuth() {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const btn = document.getElementById("submitBtn");
    if (!email || !password) {
        document.getElementById("errText").textContent = "请输入邮箱和密码";
        return;
    }
    btn.disabled = true;
    btn.textContent = "请稍候…";
    clearMsgs();
    try {
        if (isRegisterMode) {
            await signUpWithEmail(email, password);
            document.getElementById("okText").textContent = "✅ 注册成功！请检查邮箱验证后登录。";
        } else {
            await loginWithEmail(email, password);
            location.href = "index.html";
        }
    } catch (e) {
        document.getElementById("errText").textContent = e.message || "登录失败";
    } finally {
        btn.disabled = false;
        btn.textContent = isRegisterMode ? "注册" : "登录";
    }
}
async function sendMagicLink() {
    const email = document.getElementById("emailInput").value.trim();
    if (!email) {
        document.getElementById("errText").textContent = "请先输入邮箱";
        return;
    }
    clearMsgs();
    try {
        await loginWithMagicLink(email);
        document.getElementById("okText").textContent = "✅ 已发送！请查收邮箱点击链接登录。";
    } catch (e) {
        document.getElementById("errText").textContent = e.message || "发送失败";
    }
}
function enterGuest() {
    location.href = "index.html";
}
// 处理回调（邮箱验证/魔法链接/OAuth 跳转回来）
(async function initCallback() {
    const okText = document.getElementById("okText");
    const hasHash = location.hash && location.hash.length > 1;
    const hasCode = new URLSearchParams(location.search).get("code");
    if (hasHash || hasCode) {
        okText.textContent = "🔗 正在验证登录…";
        const ok = await handleAuthCallback();
        if (ok) {
            okText.textContent = "✅ 登录成功，正在跳转…";
            // 清理 URL 中的 hash/code
            history.replaceState(null, "", location.pathname);
            setTimeout(() => location.href = "index.html", 600);
        } else {
            okText.textContent = "";
            document.getElementById("errText").textContent = "验证链接无效或已过期，请重新登录";
            history.replaceState(null, "", location.pathname);
        }
        return;
    }
    // 已登录直接跳转
    if (isLoggedIn()) {
        location.href = "index.html";
    }
})();
</script>
</body>
</html>
