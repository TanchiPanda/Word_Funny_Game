<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词闯关 - 登录</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei","PingFang SC",sans-serif; }
  body { min-height:100vh; background:linear-gradient(135deg,#2c1b54,#422880,#201440); display:flex; align-items:center; justify-content:center; color:#fff; text-align:center; padding:20px; }
  .box { max-width:400px; width:100%; }
  .spinner { width:44px; height:44px; border:3px solid rgba(255,255,255,0.2); border-top-color:#ffd700; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 20px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .title { font-size:20px; margin-bottom:10px; }
  .msg { color:#a8a8d8; font-size:14px; line-height:1.7; }
  .err { color:#ff8888; }
  .btn { display:inline-block; margin-top:6px; padding:11px 26px; border:none; border-radius:10px;
         background:linear-gradient(135deg,#ffd700,#ff8c00); color:#1a1a2e; font-size:15px; font-weight:bold;
         cursor:pointer; text-decoration:none; }
  .btn-ghost { background:rgba(255,255,255,0.12); color:#fff; margin-left:8px; }
  .user { color:#ffd700; font-weight:bold; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div class="title" id="title">正在登录…</div>
  <div class="msg" id="msg"></div>
</div>

<script src="dict/msauth.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var wantToken = q.get("gettoken") === "true";
  var returnTo = q.get("return") || msTakeReturnTo("index.html");
  var redirectUri = location.origin + "/login.html";

  var spinner = document.getElementById("spinner");
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");

  function fail(text) {
    spinner.style.display = "none";
    title.innerText = "❌ 登录失败";
    msg.className = "msg err";
    msg.innerText = text;
    msg.innerHTML += '<br><br><a class="btn" href="index.html">返回首页</a>' +
                     '<a class="btn btn-ghost" href="#" onclick="location.reload();return false;">重试</a>';
  }

  function done(user) {
    spinner.style.display = "none";
    title.innerText = "✅ 登录成功";
    msg.innerHTML = '欢迎，<span class="user">' + (user.name || user.email || "") + '</span>！正在进入…';
    setTimeout(function () { location.replace(returnTo); }, 700);
  }

  (async function () {
    try {
      title.innerText = "正在验证…";
      var result = await msHandleRedirect(redirectUri);
      if (result) { done(result); return; }

      if (wantToken && msGetUser()) {
        var t = await msGetToken({ force: true, noRedirect: true });
        if (t) {
          spinner.style.display = "none";
          title.innerText = "✅ 已获取微软授权";
          msg.innerText = "正在返回…";
          setTimeout(function () { location.replace(returnTo); }, 600);
          return;
        }
      }

      spinner.style.display = "none";
      title.innerText = "🔐 微软账号登录";
      msg.innerHTML = '使用 Microsoft 账号登录《单词闯关》<br>同时可访问 OneDrive 同步学习数据<br><br>';
      var b = document.createElement("button");
      b.className = "btn";
      b.innerText = "使用 Microsoft 账号登录";
      b.onclick = function () {
        b.disabled = true;
        b.innerText = "正在跳转…";
        msLogin({ redirectUri: redirectUri, returnTo: returnTo, prompt: "select_account" });
      };
      msg.appendChild(b);
    } catch (e) {
      fail(e.message || String(e));
    }
  })();
})();
</script>
</body>
</html>
