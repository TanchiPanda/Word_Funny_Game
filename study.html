<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>📕 词典学习</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg,#1a1040 0%,#2d1b5e 50%,#1a1040 100%);
    min-height: 100vh;
    color: #fff;
    padding: 16px;
}
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.back-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
}
.back-btn:active { transform: scale(0.95); }
.progress-text {
    font-size: 14px;
    color: #a8a8d8;
}
/* 单词卡片 */
.word-card {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,107,107,0.3);
    border-radius: 18px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 16px;
}
.word-en {
    font-size: 36px;
    font-weight: bold;
    color: #ff6b6b;
    margin-bottom: 8px;
    word-break: break-word;
}
.word-phonetic {
    font-size: 16px;
    color: #ffd700;
    margin-bottom: 8px;
}
.word-pos {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 6px;
    background: rgba(78,205,196,0.2);
    color: #4ecdc4;
    font-size: 13px;
    margin-bottom: 12px;
}
.word-cn {
    font-size: 20px;
    color: #e8e8f5;
    line-height: 1.5;
}
/* 上一个/下一个 */
.nav-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
}
.nav-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
}
.nav-btn:active { transform: scale(0.97); }
.nav-btn.prev {
    background: rgba(255,255,255,0.12);
    color: #fff;
}
.nav-btn.next {
    background: linear-gradient(90deg,#ff6b6b,#ee4c4c);
    color: #fff;
}
.nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}
/* 词典 iframe */
.dict-label {
    font-size: 13px;
    color: #a8a8d8;
    margin-bottom: 8px;
    letter-spacing: 1px;
}
.dict-frame-wrap {
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: #fff;
    height: 55vh;
}
.dict-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>
<body>
<div class="top-bar">
    <button class="back-btn" onclick="location.href='index.html'">← 返回</button>
    <div class="progress-text" id="progressText">0 / 0</div>
</div>

<div class="word-card">
    <div class="word-en" id="wordEn">加载中…</div>
    <div class="word-phonetic" id="wordPhonetic"></div>
    <div class="word-pos" id="wordPos"></div>
    <div class="word-cn" id="wordCn"></div>
</div>

<div class="nav-row">
    <button class="nav-btn prev" id="prevBtn" onclick="prevWord()">← 上一个</button>
    <button class="nav-btn next" id="nextBtn" onclick="nextWord()">下一个 →</button>
</div>

<div class="dict-label">📖 词典释义（在线）</div>
<div class="dict-frame-wrap">
    <iframe id="dictFrame" src="about:blank" referrerpolicy="no-referrer"></iframe>
</div>

<script src="dict/wbook.js?v=20260925b"></script>
<script>
const STUDY_IDX_KEY = "wordGameStudyIdx";
const DEFAULT_DICT_TPL = "https://cn.bing.com/dict/%d";

loadCurrentSelection();
let wordList = activeWordList();
let idx = parseInt(localStorage.getItem(STUDY_IDX_KEY) || "0", 10);
if (isNaN(idx) || idx < 0 || idx >= wordList.length) idx = 0;

function getDictTpl() {
    const tpl = localStorage.getItem("wordGameDictTpl");
    return tpl || DEFAULT_DICT_TPL;
}
function buildDictUrl(word) {
    const tpl = getDictTpl();
    // 去掉短语中的空格，Bing 词典用空格也可，但编码后更稳
    const enc = encodeURIComponent(word.trim());
    return tpl.replace("%d", enc);
}
function renderWord() {
    const w = wordList[idx];
    document.getElementById("wordEn").innerText = w.en;
    document.getElementById("wordPhonetic").innerText = w.phonetic || "";
    document.getElementById("wordPos").innerText = w.pos || "";
    document.getElementById("wordCn").innerText = w.cn || "";
    document.getElementById("progressText").innerText = (idx + 1) + " / " + wordList.length;
    document.getElementById("prevBtn").disabled = (idx === 0);
    document.getElementById("nextBtn").disabled = (idx === wordList.length - 1);
    document.getElementById("dictFrame").src = buildDictUrl(w.en);
    localStorage.setItem(STUDY_IDX_KEY, String(idx));
}
function prevWord() {
    if (idx > 0) { idx--; renderWord(); }
}
function nextWord() {
    if (idx < wordList.length - 1) { idx++; renderWord(); }
}
renderWord();
</script>
<script src="dict/sidebar.js?v=20260926"></script>
</body>
</html>
